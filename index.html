// Self-contained multi/single tag picker; manages its own selection without a global re-render.
function buildTagPicker(initial, multi, known, noun) {
  const wrap = el("div", "picker-wrap");
  const picker = el("div", "picker");
  const selected = new Set(initial || []);
  const all = Array.from(new Set((known || []).concat(Array.from(selected))));
  function sync() { picker.querySelectorAll(".pchip").forEach(c => c.classList.toggle("sel", selected.has(c.textContent))); }
  function chipFor(name) {
    const chip = el("div", "pchip" + (selected.has(name) ? " sel" : ""));
    chip.textContent = name;
    chip.onclick = (e) => {
      e.stopPropagation();
      if (selected.has(name)) selected.delete(name);
      else { if (!multi) selected.clear(); selected.add(name); }
      sync();
    };
    return chip;
  }
  all.forEach(n => picker.appendChild(chipFor(n)));
  wrap.appendChild(picker);
  const add = el("div", "padd");
  const inp = document.createElement("input"); inp.type = "text";
  inp.placeholder = multi ? ("Add a " + (noun || "value") + "\u2026") : ("Or type a " + (noun || "value") + "\u2026");
  const btn = el("button"); btn.textContent = "Add";
  const doAdd = () => {
    const v = inp.value.trim(); if (!v) return;
    if (!multi) selected.clear();
    selected.add(v);
    const exists = Array.prototype.some.call(picker.querySelectorAll(".pchip"), c => c.textContent === v);
    if (!exists) picker.appendChild(chipFor(v));
    sync(); inp.value = "";
  };
  btn.onclick = (e) => { e.stopPropagation(); doAdd(); };
  inp.onkeydown = (e) => { if (e.key === "Enter") { e.preventDefault(); doAdd(); } };
  add.append(inp, btn); wrap.appendChild(add);
  return { element: wrap, get: () => Array.from(selected) };
}

// Clickable status pill with a dropdown that writes the chosen status back to Grist.
function statusControl(r, kind) {
  const wrap = el("div", "statuswrap");
  const has = r.status !== null && r.status !== undefined && String(r.status).trim() !== "";
  const pill = el("button", "statuspill" + (kind === "complete" || kind === "ready" ? " is-complete" : ""));
  pill.innerHTML = esc(has ? String(r.status) : "Set status") + ' <span class="pcaret">&#9662;</span>';
  pill.onclick = (e) => { e.stopPropagation(); const wasOpen = state.openStatusRow === r.id; clearTransient(); state.openStatusRow = wasOpen ? null : r.id; render(); };
  wrap.appendChild(pill);

  if (state.openStatusRow === r.id) {
    const menu = el("div", "statusmenu");
    menu.onclick = (e) => e.stopPropagation();
    const opts = statusOptions();
    if (!opts.length) menu.appendChild(Object.assign(el("div", "empty"), { textContent: "No status values yet." }));
    opts.forEach(s => {
      const item = el("button", "statusitem" + (String(r.status) === s ? " current" : ""));
      item.textContent = s;
      item.onclick = () => { state.openStatusRow = null; setStatus(r.id, s); render(); };
      menu.appendChild(item);
    });
    if (has) {
      const clr = el("button", "statusitem clear"); clr.textContent = "Clear status";
      clr.onclick = () => { state.openStatusRow = null; setStatus(r.id, null); render(); };
      menu.appendChild(clr);
    }
    wrap.appendChild(menu);
  }
  return wrap;
}

// Distinct status values currently present in the table (used to populate the menu).
function statusOptions() {
  const set = new Set();
  for (const r of state.records) {
    const s = r.status;
    if (s !== null && s !== undefined && String(s).trim() !== "") set.add(String(s));
  }
  return Array.from(set).sort((a, b) => a.localeCompare(b));
}

function pad2(n) { return String(n).padStart(2, "0"); }
function pad4(n) { return String(n).padStart(4, "0"); }
function fmtShortDate(due) {
  let s = MONTHS[due.mo].slice(0, 3) + " " + due.d;
  if (due.y !== (new Date()).getFullYear()) s += ", " + due.y;
  return s;
}
// Add N days to the date currently in the picker (so offsets stack and build on the deadline's date).
function shiftDateInput(input, n) {
  const base = input.value ? input.value.split("-").map(Number) : null;
  const d = base ? new Date(base[0], base[1] - 1, base[2]) : stripTime(new Date());
  d.setDate(d.getDate() + n);
  input.value = pad4(d.getFullYear()) + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate());
}

// Encode a chosen date/time back to a Grist timestamp (UTC midnight for Date, local moment for DateTime).
function encodeDue(dateStr, timeStr) {
  const p = dateStr.split("-").map(Number);
  const Y = p[0], M = p[1], D = p[2];
  if (state.dueIsDateTime) {
    let h = 9, mi = 0;
    if (timeStr) { const t = timeStr.split(":").map(Number); h = t[0]; mi = t[1]; }
    return new Date(Y, M - 1, D, h, mi, 0, 0).getTime() / 1000;
  }
  return Date.UTC(Y, M - 1, D) / 1000;
}

// Clickable due time/date that opens an inline editor writing the new date back to Grist.
function dueCell(r, compact) {
  const wrap = el("div", "duewrap");
  let label;
  if (r.due.timeStr) label = r.due.timeStr;       // timed: always show the time
  else if (compact) label = "";                   // week chip: day is already in the column header
  else label = fmtShortDate(r.due);               // list views: show the assigned date
  const btn = el("button", "time editable" + (label ? "" : " bare"));
  btn.title = "Click to change the due date";
  btn.innerHTML = (label ? esc(label) + " " : "") + '<span class="pen">\u270E</span>';
  btn.onclick = (e) => {
    e.stopPropagation();
    const wasOpen = state.openDateRow === r.id;
    clearTransient();
    state.openDateRow = wasOpen ? null : r.id;
    render();
  };
  wrap.appendChild(btn);
  if (state.mapped.daysLeft && r.daysLeft !== null && r.daysLeft !== undefined && r.daysLeft !== "") {
    const dl = Number(r.daysLeft);
    if (Number.isFinite(dl)) {
      const n = Math.round(dl);
      let text, cls;
      if (n === 0) { text = "due today"; cls = "dl-today"; }
      else if (n > 0) { text = n + " day" + (n === 1 ? "" : "s") + " left"; cls = "dl-future"; }
      else { const a = Math.abs(n); text = a + " day" + (a === 1 ? "" : "s") + " overdue"; cls = "dl-over"; }
      wrap.appendChild(Object.assign(el("div", "daysleft " + cls), { textContent: text }));
    }
  }
  if (state.openDateRow === r.id) wrap.appendChild(dateEditor(r));
  return wrap;
}

function dateEditor(r) {
  const ed = el("div", "dateeditor");
  ["click", "mousedown"].forEach(ev => ed.addEventListener(ev, e => e.stopPropagation()));

  const dateIn = document.createElement("input");
  dateIn.type = "date";
  dateIn.value = pad4(r.due.y) + "-" + pad2(r.due.mo + 1) + "-" + pad2(r.due.d);
  ed.appendChild(dateIn);

  let timeIn = null;
  if (state.dueIsDateTime) {
    timeIn = document.createElement("input");
    timeIn.type = "time";
    const mod = r.due.minuteOfDay >= 0 ? r.due.minuteOfDay : 9 * 60; // default 9:00 AM
    timeIn.value = pad2(Math.floor(mod / 60)) + ":" + pad2(mod % 60);
    ed.appendChild(timeIn);
  }

  // Relative offsets, applied to whatever date is currently in the picker (composable).
  const sc = el("div", "de-shortcuts");
  [["+1d", 1, "Next day"], ["+7d", 7, "In 7 days"], ["+14d", 14, "In 14 days"], ["+30d", 30, "In 30 days"]].forEach(([lbl, n, tip]) => {
    const b = el("button"); b.textContent = lbl; b.title = tip;
    b.onclick = () => shiftDateInput(dateIn, n);
    sc.appendChild(b);
  });
  ed.appendChild(sc);

  const acts = el("div", "de-actions");
  const save = el("button", "de-save"); save.textContent = "Save";
  save.onclick = () => {
    if (!dateIn.value) return;
    const ts = encodeDue(dateIn.value, timeIn ? timeIn.value : null);
    state.openDateRow = null;
    setDue(r.id, ts);
    render();
  };
  const cancel = el("button", "de-cancel"); cancel.textContent = "Cancel";
  cancel.onclick = () => { state.openDateRow = null; render(); };
  acts.append(save, cancel);
  ed.appendChild(acts);
  return ed;
}

function dayListEl(key, compact) {
  const recs = recordsForKey(key);
  if (!recs.length) { const e = el("div", "empty"); e.textContent = "No deadlines."; return e; }
  const frag = document.createDocumentFragment();
  recs.forEach(r => frag.appendChild(rowEl(r, compact)));
  return frag;
}

/* ---- Agenda: a flat, ranked list of pending deadlines ----
   Ranking mirrors the Work Queue widgets' discipline (band dominates, then
   priority, then date) but is computed entirely from the due date, so it
   works even without the optional Days-to-Complete-style fields those
   widgets use. Band always wins; priority only breaks ties within a band. */
function daysUntilDue(r) {
  if (!r.due) return null;
  const target = new Date(r.due.y, r.due.mo, r.due.d);
  return Math.round((target - stripTime(new Date())) / 86400000);
}
const AGENDA_BANDS = ["No date", "Upcoming", "Due soon", "Overdue"];
function agendaBand(r) {
  const dl = daysUntilDue(r);
  if (dl === null) return 0;       // undated -> lowest, sorts last
  if (dl < 0) return 3;            // overdue -> highest
  if (dl <= 3) return 2;           // due today through 3 days out
  return 1;                        // everything else upcoming
}
function agendaCompare(a, b) {
  if (searchActive()) {
    const ma = matchesSearch(a) ? 1 : 0, mb = matchesSearch(b) ? 1 : 0;
    if (ma !== mb) return mb - ma;                                   // a search match always outranks a non-match
  }
  const ba = agendaBand(a), bb = agendaBand(b);
  if (ba !== bb) return bb - ba;                                   // band dominates
  const pa = (state.mapped.priority && isImportant(a.priority)) ? 1 : 0;
  const pb = (state.mapped.priority && isImportant(b.priority)) ? 1 : 0;
  if (pa !== pb) return pb - pa;                                   // High priority breaks ties within a band
  const da = daysUntilDue(a), db = daysUntilDue(b);
  if (da === null && db === null) return String(a.title || "").localeCompare(String(b.title || ""));
  if (da === null) return 1;
  if (db === null) return -1;
  return da - db;                                                  // most overdue / soonest first
}
function renderAgenda() {
  const wrap = el("div", "agenda");
  const dated = state.records.filter(r => isVisible(r) && !isComplete(r));
  // Unplaced records have no r.due at all, so they can't go through rowEl()
  // (which assumes a real due date) \u2014 render them with the same widget
  // used by the "needs attention" panel instead.
  const undated = state.unplaced.filter(u => isVisible(u) && !isComplete(u));
  const pending = dated.slice().sort(agendaCompare);

  if (!pending.length && !undated.length) {
    wrap.appendChild(Object.assign(el("div", "agenda-empty"), { textContent: "Nothing pending \u2014 you're caught up." }));
    return wrap;
  }

  const renderBandGroups = (list) => {
    let lastBand = null;
    list.forEach(r => {
      const band = agendaBand(r);
      if (band !== lastBand) {
        const hd = el("div", "agenda-band agenda-band-" + band);
        hd.textContent = AGENDA_BANDS[band] + " \u00b7 " + list.filter(x => agendaBand(x) === band).length;
        wrap.appendChild(hd);
        lastBand = band;
      }
      wrap.appendChild(rowEl(r, false));
    });
  };

  if (searchActive()) {
    // Matches are already sorted first (agendaCompare), so split cleanly into
    // a promoted "matches" section and an "everything else" section, rather
    // than letting band headers repeat once for matches and again for the rest.
    const matches = pending.filter(matchesSearch);
    const rest = pending.filter(r => !matchesSearch(r));
    if (matches.length) {
      wrap.appendChild(Object.assign(el("div", "agenda-search-hd"),
        { textContent: "\uD83D\uDD0D Matching \u201c" + state.search.trim() + "\u201d \u00b7 " + matches.length }));
      renderBandGroups(matches);
    }
    if (rest.length) {
      wrap.appendChild(Object.assign(el("div", "agenda-search-hd agenda-search-hd-rest"), { textContent: "Other pending deadlines" }));
      renderBandGroups(rest);
    }
  } else {
    renderBandGroups(pending);
  }

  if (undated.length) {
    const sortedUndated = searchActive()
      ? undated.slice().sort((a, b) => (matchesSearch(b) ? 1 : 0) - (matchesSearch(a) ? 1 : 0))
      : undated;
    const hd = el("div", "agenda-band agenda-band-0");
    hd.textContent = "No date \u00b7 " + undated.length;
    wrap.appendChild(hd);
    sortedUndated.forEach(u => wrap.appendChild(unplacedItem(u)));
  }
  return wrap;
}

/* ---- Month ---- */
function renderMonth() {
  const wrap = el("div", "month");
  const cols = visibleDowIndices();
  const head = el("div", "weekhead");
  head.style.gridTemplateColumns = "repeat(" + cols.length + ", 1fr)";
  cols.forEach(idx => head.appendChild(Object.assign(el("div"), { textContent: DOW[idx] })));
  wrap.appendChild(head);

  const grid = el("div", "grid");
  grid.style.gridTemplateColumns = "repeat(" + cols.length + ", 1fr)";
  const first = new Date(state.focus.getFullYear(), state.focus.getMonth(), 1);
  const start = startOfWeek(first);
  const todayKey = dayKeyFromDate(new Date());

  for (let i = 0; i < 42; i++) {
    const d = addDays(start, i);
    if (state.hideWeekends && (d.getDay() === 0 || d.getDay() === 6)) continue;
    const key = dayKeyFromDate(d);
    const outside = d.getMonth() !== state.focus.getMonth();
    const cell = el("div", "cell" + (outside ? " outside" : "")
      + (key === todayKey ? " today" : "") + (key === state.selectedKey ? " selected" : ""));
    cell.appendChild(Object.assign(el("div", "daynum"), { textContent: d.getDate() }));

    const recs = (outside && !state.showOutsideDeadlines) ? [] : recordsForKey(key);
    const shown = recs.slice(0, state.maxChipsPerDay);
    shown.forEach(r => {
      const kind = classify(r);
      const related = caseHighlightOn() && r.caseLabel && r.caseLabel === state.highlightCase;
      const matched = searchActive() && matchesSearch(r);
      const chip = el("div", "chip" + (visualKind(kind) !== "normal" ? " chip-" + visualKind(kind) : "") + (related ? " case-highlight" : "") + (matched ? " search-match" : ""));
      applyTaskColor(chip, r, kind);
      if (caseHighlightOn() && r.caseLabel) { chip.dataset.case = r.caseLabel; chip.title = r.caseLabel; }
      const tt = r.due.timeStr ? '<span class="t">' + esc(r.due.timeStr) + "</span>" : "";
      const pre = kind === "complete" ? "\u2713 " : "";
      chip.innerHTML = tt + esc(pre + (r.title || "(untitled)"));
      chip.onclick = (e) => {
        e.stopPropagation();
        state.selectedKey = key; state.focus = stripTime(d);
        if (caseHighlightOn() && r.caseLabel) {
          state.highlightCase = (state.highlightCase === r.caseLabel) ? null : r.caseLabel;
        }
        render();
      };
      makeDraggable(chip, r);
      cell.appendChild(chip);
    });
    if (recs.length > shown.length) {
      const hiddenMatches = searchActive() ? recs.slice(shown.length).filter(matchesSearch).length : 0;
      const moreEl = el("div", "more" + (hiddenMatches ? " more-has-match" : ""));
      moreEl.textContent = "+" + (recs.length - shown.length) + " more" + (hiddenMatches ? " (" + hiddenMatches + " match" + (hiddenMatches === 1 ? "" : "es") + ")" : "");
      cell.appendChild(moreEl);
    }

    cell.onclick = () => { state.selectedKey = key; state.focus = stripTime(d); render(); };
    makeDropTarget(cell, d);
    grid.appendChild(cell);
  }
  wrap.appendChild(grid);

  // Selected-day detail panel
  const panel = el("div", "daypanel");
  const sel = parseKeyToDate(state.selectedKey);
  panel.appendChild(Object.assign(el("h3"), { textContent: "Deadlines on " + DOW[sel.getDay()] + ", " + MONTHS[sel.getMonth()] + " " + sel.getDate() }));
  const addBtn = el("button", "addday");
  addBtn.innerHTML = "\uFF0B Add deadline on this day";
  addBtn.onclick = (e) => { e.stopPropagation(); openNewTask(state.selectedKey); };
  panel.appendChild(addBtn);
  const list = el("div", "list");
  list.appendChild(dayListEl(state.selectedKey, false));
  panel.appendChild(list);
  makeDropTarget(panel, sel);
  wrap.appendChild(panel);
  return wrap;
}

/* ---- Week ---- */
function renderWeek() {
  const wrap = el("div", "week");
  const cols = visibleDowIndices();
  wrap.style.gridTemplateColumns = "repeat(" + cols.length + ", minmax(150px, 1fr))";
  const start = startOfWeek(state.focus);
  const todayKey = dayKeyFromDate(new Date());
  for (let i = 0; i < 7; i++) {
    const d = addDays(start, i);
    if (state.hideWeekends && (d.getDay() === 0 || d.getDay() === 6)) continue;
    const key = dayKeyFromDate(d);
    const col = el("div", "weekcol" + (key === todayKey ? " today" : "") + (key === state.selectedKey ? " selected" : ""));
    const ch = el("div", "colhead");
    ch.innerHTML = '<div class="dow">' + DOW[d.getDay()] + '</div><div class="dnum">' + d.getDate() + "</div>";
    ch.onclick = () => { state.selectedKey = key; state.focus = stripTime(d); render(); };
    col.appendChild(ch);
    const cb = el("div", "colbody");
    cb.appendChild(dayListEl(key, true));
    col.appendChild(cb);
    makeDropTarget(col, d);
    wrap.appendChild(col);
  }
  return wrap;
}

/* ---- Day ---- */
function renderDay() {
  const wrap = el("div", "list");
  wrap.appendChild(dayListEl(dayKeyFromDate(state.focus), false));
  return wrap;
}

/* ===================== DOM util ===================== */
function el(tag, cls) { const e = document.createElement(tag); if (cls) e.className = cls; return e; }
function parseKeyToDate(key) { const [y, m, d] = key.split("-").map(Number); return new Date(y, m, d); }

/* ===================== New-task modal ===================== */
function closeModal() { const m = document.querySelector(".modal-overlay"); if (m) m.remove(); }

function labelEl(text) { return Object.assign(el("label"), { textContent: text }); }

// Text input backed by a datalist of known values (choose existing or type new).
function datalistInput(values, id) {
  const wrap = el("div");
  const inp = document.createElement("input"); inp.type = "text"; inp.setAttribute("list", id);
  const dl = document.createElement("datalist"); dl.id = id;
  values.forEach(v => { const o = document.createElement("option"); o.value = v; dl.appendChild(o); });
  wrap.append(inp, dl);
  return { wrap: wrap, value: () => inp.value.trim() };
}

function openNewTask(prefillKey) {
  if (!state.haveGrist || !state.mapped.due || !state.mapped.title) return;
  closeModal();
  const overlay = el("div", "modal-overlay");
  overlay.addEventListener("click", (e) => { if (e.target === overlay) closeModal(); });
  document.addEventListener("keydown", function esc(e) { if (e.key === "Escape") { closeModal(); document.removeEventListener("keydown", esc); } });

  const modal = el("div", "modal");
  modal.addEventListener("click", e => e.stopPropagation());
  modal.appendChild(Object.assign(el("h3"), { textContent: "New deadline" }));
  const titleNote = el("div", "muted");
  titleNote.style.cssText = "font-size:12px;color:var(--ink-soft);margin:-4px 0 10px;";
  titleNote.textContent = "The title is generated automatically from the Case and Category once set.";
  modal.appendChild(titleNote);

  // Case / matter — type-to-filter from cases already present in the table.
  // Uses the same datalistInput as Status/Category/Priority for consistent styling.
  let caseIn = null;
  if (state.mapped.caseRef) {
    modal.appendChild(labelEl("Case"));
    const cases = Object.keys(state.caseRegistry).sort((a, b) => a.localeCompare(b));
    caseIn = datalistInput(cases, "nt-case");
    modal.appendChild(caseIn.wrap);
    if (!cases.length) {
      const note = el("div", "muted"); note.style.cssText = "font-size:12px;color:var(--ink-soft);margin:2px 0 6px;";
      note.textContent = state.caseIsRef
        ? "No cases found on existing deadlines yet. You can still type a case name \u2014 if it doesn't match one already in your case list, the deadline will be created without a case link, and you can set it in Grist afterward."
        : "No cases found on existing deadlines yet \u2014 type any case name to use it.";
      modal.appendChild(note);
    }
  }

  const base = prefillKey ? parseKeyToDate(prefillKey) : new Date();
  modal.appendChild(labelEl(state.dueIsDateTime ? "Due date & time" : "Due date"));
  const row2 = el("div", "row2");
  const dwrap = el("div");
  const dateIn = document.createElement("input"); dateIn.type = "date";
  dateIn.value = pad4(base.getFullYear()) + "-" + pad2(base.getMonth() + 1) + "-" + pad2(base.getDate());
  dwrap.appendChild(dateIn); row2.appendChild(dwrap);
  let timeIn = null;
  if (state.dueIsDateTime) {
    const twrap = el("div");
    timeIn = document.createElement("input"); timeIn.type = "time"; timeIn.value = "09:00";
    twrap.appendChild(timeIn); row2.appendChild(twrap);
  }
  modal.appendChild(row2);

  let statusIn = null, catIn = null, priIn = null, priBoolIn = null, asgPicker = null, descIn = null;
  if (state.mapped.status) { modal.appendChild(labelEl("Status")); statusIn = datalistInput(statusOptions(), "nt-status"); modal.appendChild(statusIn.wrap); }
  if (state.mapped.category) { modal.appendChild(labelEl("Category")); catIn = datalistInput(distinctValues(recCats).filter(c => c !== NO_CAT), "nt-cat"); modal.appendChild(catIn.wrap); }
  if (state.mapped.priority) {
    modal.appendChild(labelEl("Priority"));
    if (state.priIsBool) {
      const prow = el("label", "poprow"); prow.style.padding = "2px 0";
      priBoolIn = document.createElement("input"); priBoolIn.type = "checkbox";
      prow.append(priBoolIn, Object.assign(el("span", "label"), { textContent: "Important!" }));
      modal.appendChild(prow);
    } else {
      const pv = distinctValues(r => { const v = r.priority; return (v === null || v === undefined || v === "") ? [] : [String(v)]; });
      priIn = datalistInput(pv, "nt-pri"); modal.appendChild(priIn.wrap);
    }
  }
  if (state.mapped.assignedTo) { modal.appendChild(labelEl("Assigned to")); asgPicker = buildTagPicker([], state.asgMulti, distinctValues(recAsgs).filter(v => v !== UNASSIGNED), "name"); modal.appendChild(asgPicker.element); }
  if (state.mapped.description) { modal.appendChild(labelEl("Description")); descIn = document.createElement("textarea"); modal.appendChild(descIn); }

  const acts = el("div", "modal-actions");
  const createB = el("button", "m-create"); createB.textContent = "Create";
  createB.onclick = () => {
    // Title is a formula column (derived from Case + Category) — never written here.
    if (!dateIn.value) { dateIn.style.borderColor = "var(--red)"; return; }
    const fields = {};
    let pendingCaseNote = null;
    fields[state.cols.DueDate] = encodeDue(dateIn.value, timeIn ? timeIn.value : null);
    if (caseIn && caseIn.value()) {
      const typed = caseIn.value();
      // Resolve the typed text to a known case (exact first, then case-insensitive).
      let label = null;
      if (Object.prototype.hasOwnProperty.call(state.caseRegistry, typed)) label = typed;
      else {
        const hit = Object.keys(state.caseRegistry).find(k => k.toLowerCase() === typed.toLowerCase());
        if (hit) label = hit;
      }
      if (label) {
        const refId = state.caseRegistry[label];
        const isRef = state.caseTypeKnown ? state.caseIsRef : (typeof refId === "number");
        if (isRef) {
          // A Reference column requires the target row id. Only write when we have one.
          if (typeof refId === "number") fields[state.cols.Case] = refId;
          else pendingCaseNote = label;   // no id resolved — create unlinked, note it below
        } else {
          fields[state.cols.Case] = label;   // Choice / Text case name
        }
      } else {
        // Typed text doesn't match any known case.
        const isRef = state.caseTypeKnown ? state.caseIsRef : false;
        if (isRef) pendingCaseNote = typed;                 // can't create a new reference from here
        else fields[state.cols.Case] = typed;               // Choice/Text can take a fresh name
      }
    }
    if (statusIn && statusIn.value()) fields[state.cols.Status] = statusIn.value();
    if (catIn && catIn.value()) fields[state.cols.Category] = state.catMulti ? ["L", catIn.value()] : catIn.value();
    if (priBoolIn) { if (priBoolIn.checked) fields[state.cols.Priority] = true; }
    else if (priIn && priIn.value()) {
      const pv = priIn.value();
      fields[state.cols.Priority] = (pv !== "" && !isNaN(Number(pv))) ? Number(pv) : pv;
    }
    if (asgPicker) { const a = encodeAssignees(asgPicker.get()); if (a !== null) fields[state.cols.AssignedTo] = a; }
    if (descIn && descIn.value.trim()) fields[state.cols.Description] = descIn.value;
    createTask(fields).then(ok => {
      if (ok && pendingCaseNote) {
        alert("Deadline created. The case \u201c" + pendingCaseNote + "\u201d couldn't be linked " +
              "because its row id wasn't available \u2014 open the deadline in Grist to set the Case.");
      }
    });
    closeModal();
  };
  const cancelB = el("button", "m-cancel"); cancelB.textContent = "Cancel";
  cancelB.onclick = () => closeModal();
  acts.append(createB, cancelB);
  modal.appendChild(acts);

  overlay.appendChild(modal);
  document.body.appendChild(overlay);
  if (caseIn) caseIn.wrap.querySelector("input").focus();
  else dateIn.focus();
}

document.addEventListener("click", () => {
  let changed = false;
  if (state.openPopover) { state.openPopover = null; changed = true; }
  if (state.openStatusRow !== null) { state.openStatusRow = null; changed = true; }
  if (state.openDateRow !== null) { state.openDateRow = null; changed = true; }
  if (state.highlightCase !== null) { state.highlightCase = null; changed = true; }
  if (changed) render();
});

/* ===================== Grist wiring ===================== */
function selectInGrist(rowId) {
  try { grist.setCursorPos({ rowId }); } catch (e) { /* linked-cursor optional */ }
}

// Permanently remove a deadline from the source table.
async function deleteTask(rowId, title) {
  const label = title && String(title).trim() ? "\u201c" + String(title).trim() + "\u201d" : "this deadline";
  if (!confirm("Delete " + label + "? This removes it from the table and cannot be undone here.")) return;
  try {
    await grist.selectedTable.destroy(rowId);
  } catch (e) {
    try {
      const tid = await grist.selectedTable.getTableId();
      await grist.docApi.applyUserActions([["RemoveRecord", tid, rowId]]);
    } catch (e2) {
      console.error("delete failed", e2);
      const msg = String((e2 && e2.message) || e2 || "");
      if (/access|permission|read-only|denied/i.test(msg)) {
        alert("Could not delete the deadline: the widget needs full (read \u0026 write) access. " +
              "Open the creator panel and set access to Full.");
      } else {
        alert("Could not delete the deadline." + (msg ? " Grist reported: " + msg : ""));
      }
      return;
    }
  }
  // Deselect/clean up any UI state pointing at the row we just removed.
  if (state.expandedRows) state.expandedRows.delete(rowId);
  render();
}

// Write a single field back to the source table, directly from the calendar.
async function writeField(rowId, colId, value, label) {
  if (!colId) return;
  const fields = {}; fields[colId] = value;
  try {
    await grist.selectedTable.update({ id: rowId, fields: fields });
  } catch (e) {
    try {
      const tid = await grist.selectedTable.getTableId();
      await grist.docApi.applyUserActions([["UpdateRecord", tid, rowId, fields]]);
    } catch (e2) {
      console.error(label + " update failed", e2);
      alert("Could not update " + label + ". The widget needs full (read \u0026 write) access \u2014 check the widget's access setting in the creator panel.");
    }
  }
}
function setStatus(rowId, value) { if (state.mapped.status) writeField(rowId, state.statusColId, value, "status"); }
function setDue(rowId, ts) { if (state.mapped.due) writeField(rowId, state.dueColId, ts, "due date"); }

/* ===================== Drag-and-drop rescheduling ===================== */
// Dragging is ephemeral UI state, not part of `state` (no need to persist or
// trigger a full re-render on every dragover).
let draggingId = null;

// Move a task to a new day, preserving its time-of-day if the column is a
// DateTime. A drop back onto the task's current day is a harmless no-op.
function moveTaskToDay(rec, targetDate) {
  if (!rec || !rec.due) return;
  const curKey = dayKeyFromYMD(rec.due.y, rec.due.mo, rec.due.d);
  const targetKey = dayKeyFromDate(targetDate);
  if (curKey === targetKey) return;
  const timeStr = (state.dueIsDateTime && rec.due.minuteOfDay >= 0)
    ? pad2(Math.floor(rec.due.minuteOfDay / 60)) + ":" + pad2(rec.due.minuteOfDay % 60)
    : null;
  setDue(rec.id, encodeDue(iso(targetDate), timeStr));
}

// Make an element a drag SOURCE representing task `r`.
function makeDraggable(node, r) {
  node.draggable = true;
  node.addEventListener("dragstart", (e) => {
    draggingId = r.id;
    try { e.dataTransfer.setData("text/plain", String(r.id)); e.dataTransfer.effectAllowed = "move"; } catch (err) {}
    node.classList.add("dragging");
    // Highlight every other deadline for the same case, so you can see whether
    // you're about to drag this task past a related one. Applied directly to the
    // live DOM (not via render()) so an in-progress native drag isn't disrupted
    // by the whole calendar being rebuilt underneath it.
    if (caseHighlightOn() && r.caseLabel) {
      document.querySelectorAll('[data-case]').forEach(n => {
        if (n.dataset.case === r.caseLabel) n.classList.add("case-highlight");
      });
    }
  });
  node.addEventListener("dragend", () => {
    draggingId = null;
    node.classList.remove("dragging");
    document.querySelectorAll(".dragover").forEach(n => n.classList.remove("dragover"));
    // Only clear the drag-applied highlight, not one the user set by clicking a
    // chip/row \u2014 that's tracked in state and re-applied by the next render().
    if (!(caseHighlightOn() && r.caseLabel && r.caseLabel === state.highlightCase)) {
      document.querySelectorAll('[data-case="' + cssEscape(r.caseLabel || "") + '"].case-highlight')
        .forEach(n => n.classList.remove("case-highlight"));
    }
  });
}

// Minimal CSS.escape fallback for building an attribute-value selector safely
// (case names can contain quotes, parens, etc.).
function cssEscape(s) {
  if (window.CSS && CSS.escape) return CSS.escape(s);
  return String(s).replace(/["\\]/g, "\\$&");
}

// Make an element a drop TARGET for day `targetDate`.
function makeDropTarget(node, targetDate) {
  node.addEventListener("dragover", (e) => {
    if (draggingId == null) return;
    e.preventDefault();
    try { e.dataTransfer.dropEffect = "move"; } catch (err) {}
    node.classList.add("dragover");
  });
  node.addEventListener("dragleave", () => node.classList.remove("dragover"));
  node.addEventListener("drop", (e) => {
    e.preventDefault();
    node.classList.remove("dragover");
    let idStr = "";
    try { idStr = e.dataTransfer.getData("text/plain"); } catch (err) {}
    const id = idStr ? Number(idStr) : draggingId;
    draggingId = null;
    if (id == null || Number.isNaN(id)) return;
    const rec = state.records.find(x => x.id === id);
    if (rec) moveTaskToDay(rec, targetDate);
  });
}
function setDescription(rowId, text) {
  if (state.mapped.description) writeField(rowId, state.descColId, (text && text.trim() !== "") ? text : null, "description");
}
function encodeMulti(arr, multi) {
  if (!arr || !arr.length) return null;
  return multi ? ["L"].concat(arr) : arr[0];
}
function encodeAssignees(arr) { return encodeMulti(arr, state.asgMulti); }
function setAssignees(rowId, arr) {
  if (state.mapped.assignedTo) writeField(rowId, state.asgColId, encodeAssignees(arr), "assignee");
}
function setCategory(rowId, arr) {
  if (state.mapped.category) writeField(rowId, state.cols.Category, encodeMulti(arr, state.catMulti), "category");
}
function setPriority(rowId, arr) {
  if (!state.mapped.priority) return;
  let v = (arr && arr.length) ? arr[0] : null;
  if (v !== null && v !== "" && !isNaN(Number(v))) v = Number(v);
  writeField(rowId, state.cols.Priority, v, "priority");
}
async function createTask(fields, opts) {
  opts = opts || {};
  // Guard: never send null/undefined column IDs (a create with a bad key throws).
  const clean = {};
  Object.keys(fields).forEach(k => { if (k && k !== "null" && k !== "undefined" && fields[k] !== undefined) clean[k] = fields[k]; });
  try {
    await grist.selectedTable.create({ fields: clean });
    return true;
  } catch (e) {
    // Retry via user actions (more permissive for some column types).
    try {
      const tid = await grist.selectedTable.getTableId();
      await grist.docApi.applyUserActions([["AddRecord", tid, null, clean]]);
      return true;
    } catch (e2) {
      const msg = String((e2 && e2.message) || e2 || "");
      // A Reference column rejects a name string — retry once without the Case field,
      // so the deadline is still created (just unlinked) rather than lost entirely.
      const caseCol = state.cols.Case;
      if (!opts.noCase && caseCol && clean[caseCol] !== undefined &&
          /ref|reference|type|invalid|convert/i.test(msg)) {
        const without = Object.assign({}, clean); delete without[caseCol];
        const ok = await createTask(without, { noCase: true });
        if (ok) {
          alert("Deadline created, but the case couldn't be linked automatically. " +
                "Open it in Grist and set the Case, or map the Case column to a plain text field. " +
                "(Details: " + msg + ")");
          return true;
        }
      }
      console.error("create failed", e2);
      // Distinguish an access problem from a data problem in the message.
      if (/access|permission|read-only|denied/i.test(msg)) {
        alert("Could not create the deadline: the widget needs full (read \u0026 write) access. " +
              "Open the creator panel and set access to Full.");
      } else {
        alert("Could not create the deadline. " + (msg ? "Grist reported: " + msg : "Unknown error.") +
              "\n\nIf this mentions the Case column, try mapping it to a plain Choice/Text field, " +
              "or leave Case unset when creating from the calendar.");
      }
      return false;
    }
  }
}

// Resolve relevant column types (Date vs DateTime, single vs list) from doc metadata.
async function detectColumnTypes() {
  try {
    const tableId = await grist.selectedTable.getTableId();
    const tables = await grist.docApi.fetchTable("_grist_Tables");
    let ref = null;
    for (let i = 0; i < tables.id.length; i++) { if (tables.tableId[i] === tableId) { ref = tables.id[i]; break; } }
    const cols = await grist.docApi.fetchTable("_grist_Tables_column");
    const typeOf = (colId) => {
      if (!colId) return null;
      for (let i = 0; i < cols.id.length; i++) {
        if (cols.colId[i] === colId && (ref === null || cols.parentId[i] === ref)) return String(cols.type[i] || "");
      }
      return null;
    };
    const rowIndexOf = (colId) => {
      if (!colId) return -1;
      for (let i = 0; i < cols.id.length; i++) {
        if (cols.colId[i] === colId && (ref === null || cols.parentId[i] === ref)) return i;
      }
      return -1;
    };
    const isList = (t) => t.indexOf("ChoiceList") === 0 || t.indexOf("RefList") === 0;
    const dt = typeOf(state.cols.DueDate);
    if (dt !== null) { state.dueTypeFromMeta = dt.indexOf("DateTime") === 0; state.dueIsDateTime = state.dueTypeFromMeta; }
    const at = typeOf(state.cols.AssignedTo);
    if (at !== null) { state.asgMulti = isList(at); state.asgTypeKnown = true; }
    // Pick up per-person colors from Grist's own Choice/ChoiceList column
    // config, if the person has configured them there ("the color of that
    // person's name in the Deadlines tab"). No config found -> falls back
    // to personColor()'s deterministic palette at render time.
    const asgIdx = rowIndexOf(state.cols.AssignedTo);
    if (asgIdx >= 0 && cols.widgetOptions) {
      try {
        const opts = JSON.parse(cols.widgetOptions[asgIdx] || "{}");
        if (opts && opts.choiceOptions) {
          const map = {};
          Object.keys(opts.choiceOptions).forEach(name => {
            const co = opts.choiceOptions[name];
            if (co && co.fillColor) map[name] = co.fillColor;
          });
          state.assigneeColors = map;
        }
      } catch (e) { /* leave assigneeColors empty -> fallback palette used */ }
    }
    const cst = typeOf(state.cols.Case);
    if (cst !== null) {
      state.caseIsRef = (cst.indexOf("Ref") === 0);
      state.caseTypeKnown = true;
      const m = cst.match(/^Ref(?:List)?:(.+)$/);
      state.caseTargetTable = m ? m[1] : null;
    }
    const ct = typeOf(state.cols.Category);
    if (ct !== null) { state.catMulti = isList(ct); state.catTypeKnown = true; }
    const pt = typeOf(state.cols.Priority);
    if (pt !== null) { state.priIsBool = pt === "Bool"; state.priTypeKnown = true; }
    await refreshCaseIds();
    render();
  } catch (e) { /* keep data-based heuristics */ }
}

// Extract a plain row id from a raw reference cell value (fetchTable gives
// unresolved data, so this is normally just a number, but be defensive).
function extractRefId(v) {
  if (typeof v === "number") return v > 0 ? v : null;
  if (Array.isArray(v)) {
    if (v[0] === "R" && v.length >= 3 && typeof v[2] === "number") return v[2];
    const items = v[0] === "L" ? v.slice(1) : v;
    if (items.length && typeof items[0] === "number") return items[0];
  }
  return null;
}

// Resolve real row ids for cases already used in the deadlines table.
// onRecords can hand back a Reference column already resolved to its display
// text (no id attached), which is why a case picked from the "existing cases"
// list could fail to link. This reads the RAW column values straight from the
// table via fetchTable \u2014 which are always plain row ids for a Reference \u2014
// and matches them back to each deadline by row id, so the case registry ends
// up with a real, writable reference id instead of just a label.
async function refreshCaseIds() {
  if (!state.mapped.caseRef || !state.caseTypeKnown || !state.caseIsRef) return;
  const colId = state.cols.Case;
  if (!colId) return;
  try {
    const tableId = await grist.selectedTable.getTableId();
    const raw = await grist.docApi.fetchTable(tableId);
    if (!raw || !raw.id || !(colId in raw)) return;
    const rawVals = raw[colId];
    const byRowId = {};
    for (let i = 0; i < raw.id.length; i++) byRowId[raw.id[i]] = extractRefId(rawVals[i]);
    state.caseRawById = byRowId;
    // Patch the registry with real ids wherever a placed/unplaced record resolves one.
    state.records.concat(state.unplaced).forEach(r => {
      const rid = byRowId[r.id];
      if (r.caseLabel && typeof rid === "number") state.caseRegistry[r.caseLabel] = rid;
    });
  } catch (e) { /* fall back to whatever readCase() already resolved */ }
}

function persist() {
  if (!state.haveGrist) return;
  try {
    grist.setOptions({
      view: state.view,
      sortByPriority: state.sortByPriority,
      sortDir: state.sortDir,
      hiddenCats: Array.from(state.hiddenCats),
      hiddenAsgs: Array.from(state.hiddenAsgs),
      hiddenStatuses: Array.from(state.hiddenStatuses),
      redCats: Array.from(state.redCats),
      showOutsideDeadlines: state.showOutsideDeadlines,
      caseHighlightEnabled: state.caseHighlightEnabled,
      weekStartDay: state.weekStartDay,
      hideWeekends: state.hideWeekends,
      maxChipsPerDay: state.maxChipsPerDay,
      timeFormat: state.timeFormat,
      searchFiltersOut: state.searchFiltersOut,
      taskColorMode: state.taskColorMode,
    });
  } catch (e) {}
}

// Read a logical column's value straight from the raw record using the
// mappings Grist passes to onRecords. Robust against mapColumnNames returning null.
function pick(rec, mappings, logical) {
  const real = mappings ? mappings[logical] : null;
  if (real === undefined || real === null) return undefined;
  if (Array.isArray(real)) return real.map(c => rec[c]); // allowMultiple mappings
  return rec[real];
}

// Normalize a Case reference cell into { id, label }.
// Grist references may arrive as a bare rowId (number), a ["R", table, rowId]
// marker, or — when the widget maps the visible column — the display string.
function readCase(rec, mappings) {
  const raw = pick(rec, mappings, "Case");
  if (raw === null || raw === undefined || raw === "") return null;
  if (typeof raw === "number") return { id: raw, label: String(raw) };
  if (Array.isArray(raw)) {
    // ["R", tableId, rowId] or a RefList; take the first meaningful entry
    if (raw[0] === "R" && raw.length >= 3) return { id: raw[2], label: String(raw[2]) };
    const items = raw[0] === "L" ? raw.slice(1) : raw;
    if (items.length) return { id: items[0], label: String(items[0]) };
    return null;
  }
  // A display string (Grist resolved the reference to its show-column value)
  return { id: null, label: String(raw) };
}

function ingest(records, mappings) {
  state.mapped = {
    due: !!mappings.DueDate,
    title: !!mappings.Title,
    category: !!mappings.Category,
    assignedTo: !!mappings.AssignedTo,
    priority: !!mappings.Priority,
    status: !!mappings.Status,
    description: !!mappings.Description,
    daysLeft: !!mappings.DaysLeft,
    caseRef: !!mappings.Case,
  };
  state.cols = {
    DueDate: mappings.DueDate || null,
    Title: mappings.Title || null,
    Status: mappings.Status || null,
    Category: mappings.Category || null,
    AssignedTo: mappings.AssignedTo || null,
    Priority: mappings.Priority || null,
    Description: mappings.Description || null,
    Case: mappings.Case || null,
  };
  state.statusColId = mappings.Status || null;
  state.dueColId = mappings.DueDate || null;
  state.descColId = mappings.Description || null;
  state.asgColId = mappings.AssignedTo || null;
  state.caseColId = mappings.Case || null;
  state.caseRegistry = {};   // display label -> reference row id (from cases already in the table)
  const out = [];
  const unplaced = [];
  for (const rec of (records || [])) {
    const rawDue = pick(rec, mappings, "DueDate");
    const due = parseDue(rawDue);
    const caseInfo = state.mapped.caseRef ? readCase(rec, mappings) : null;
    if (caseInfo && caseInfo.label) state.caseRegistry[caseInfo.label] = caseInfo.id;
    if (!due) {
      unplaced.push({
        id: rec.id,
        title: pick(rec, mappings, "Title"),
        status: state.mapped.status ? pick(rec, mappings, "Status") : null,
        category: state.mapped.category ? pick(rec, mappings, "Category") : null,
        assignedTo: state.mapped.assignedTo ? pick(rec, mappings, "AssignedTo") : null,
        caseLabel: caseInfo ? caseInfo.label : null,
        reason: (rawDue === null || rawDue === undefined || rawDue === "") ? "no-date" : "bad-date",
      });
      continue;
    }
    out.push({
      id: rec.id,
      due,
      key: dayKeyFromYMD(due.y, due.mo, due.d),
      title: pick(rec, mappings, "Title"),
      category: state.mapped.category ? pick(rec, mappings, "Category") : null,
      assignedTo: state.mapped.assignedTo ? pick(rec, mappings, "AssignedTo") : null,
      priority: state.mapped.priority ? pick(rec, mappings, "Priority") : null,
      status: state.mapped.status ? pick(rec, mappings, "Status") : null,
      description: state.mapped.description ? pick(rec, mappings, "Description") : null,
      daysLeft: state.mapped.daysLeft ? pick(rec, mappings, "DaysLeft") : null,
      caseLabel: caseInfo ? caseInfo.label : null,
      caseId: caseInfo ? caseInfo.id : null,
    });
  }
  state.records = out;
  state.unplaced = unplaced;
  // Provisional types from data until metadata resolves them.
  if (state.dueTypeFromMeta === null) state.dueIsDateTime = out.some(r => r.due.timed);
  if (!state.asgTypeKnown) state.asgMulti = out.some(r => Array.isArray(r.assignedTo));
  if (!state.catTypeKnown) state.catMulti = out.some(r => Array.isArray(r.category));
  if (!state.priTypeKnown) state.priIsBool = out.some(r => typeof r.priority === "boolean");
  seedRedCatsIfNeeded();
}

// On first run, auto-flag SOL / Trial / statute-type categories as critical (red).
// Only runs until the user's choice is loaded or set; respects any saved selection.
function seedRedCatsIfNeeded() {
  if (state.redCatsInit || !state.mapped.category) return;
  const cats = distinctValues(recCats).filter(c => c !== NO_CAT);
  if (!cats.length) return; // wait until categories are known
  cats.forEach(c => {
    const s = c.toLowerCase();
    if (s.includes("sol") || s.includes("trial") || s.includes("statute") || s.includes("limitation")) {
      state.redCats.add(c);
    }
  });
  state.redCatsInit = true;
  persist();
}

if (state.haveGrist) {
  grist.ready({
    requiredAccess: "full",
    columns: [
      { name: "DueDate", title: "Due Date", type: "Date,DateTime", description: "Date or DateTime that places the deadline on the calendar." },
      { name: "Title", title: "Calendar Title", type: "Any", description: "Text shown for each deadline. If this is a formula column (e.g. built from Case + Category), this widget only reads it \u2014 it never writes to Title, so the formula is never overridden." },
      { name: "Status", title: "Status", type: "Choice,Text", optional: true, description: "e.g. Complete / Incomplete / Ready. Editable from the calendar; Complete/Done/Closed turn the deadline green." },
      { name: "Description", title: "Description", type: "Text,Any", optional: true, description: "A longer note. Shown clipped under each deadline in the list views; click the row to expand the full text." },
      { name: "DaysLeft", title: "Days Left", type: "Int,Numeric,Any", optional: true, description: "A formula column giving days until the deadline (negative once overdue). Shown under the due date in the list views." },
      { name: "Category", title: "Category", type: "Choice,ChoiceList,Text", optional: true, description: "Used for coloring, the Categories filter, and the critical (red) Flags list." },
      { name: "Case", title: "Case / Matter", type: "Ref,Choice,Text", optional: true, description: "The case each deadline belongs to (a Reference to your master case list, or a Choice/Text case name). Lets new deadlines created here be filed under the right case." },
      { name: "AssignedTo", title: "Assigned To", type: "Choice,ChoiceList,Text", optional: true, description: "One or more team members; powers the Assigned filter." },
      { name: "Priority", title: "Priority", type: "Any", optional: true, description: "Number or choice (e.g. High/Medium/Low). High/important values turn the deadline red; also used for optional priority sorting." },
    ],
  });

  grist.onOptions((opts) => {
    opts = opts || {};
    if (opts.view) state.view = opts.view;
    if (typeof opts.sortByPriority === "boolean") state.sortByPriority = opts.sortByPriority;
    if (opts.sortDir) state.sortDir = opts.sortDir;
    if (Array.isArray(opts.hiddenCats)) state.hiddenCats = new Set(opts.hiddenCats);
    if (Array.isArray(opts.hiddenAsgs)) state.hiddenAsgs = new Set(opts.hiddenAsgs);
    if (Array.isArray(opts.hiddenStatuses)) state.hiddenStatuses = new Set(opts.hiddenStatuses);
    if (Array.isArray(opts.redCats)) { state.redCats = new Set(opts.redCats); state.redCatsInit = true; }
    if (typeof opts.showOutsideDeadlines === "boolean") state.showOutsideDeadlines = opts.showOutsideDeadlines;
    if (typeof opts.caseHighlightEnabled === "boolean") state.caseHighlightEnabled = opts.caseHighlightEnabled;
    if (typeof opts.weekStartDay === "number" && opts.weekStartDay >= 0 && opts.weekStartDay <= 6) state.weekStartDay = opts.weekStartDay;
    if (typeof opts.hideWeekends === "boolean") state.hideWeekends = opts.hideWeekends;
    if (typeof opts.maxChipsPerDay === "number" && opts.maxChipsPerDay >= 1) state.maxChipsPerDay = opts.maxChipsPerDay;
    if (opts.timeFormat === "12h" || opts.timeFormat === "24h") state.timeFormat = opts.timeFormat;
    if (typeof opts.searchFiltersOut === "boolean") state.searchFiltersOut = opts.searchFiltersOut;
    if (opts.taskColorMode === "category" || opts.taskColorMode === "assignee") state.taskColorMode = opts.taskColorMode;
    render();
  });

  grist.onRecords((records, mappings) => {
    ingest(records, mappings);
    render();
    if (!state.typesChecked && state.dueColId) {
      state.typesChecked = true;
      detectColumnTypes();
    } else if (state.caseTypeKnown && state.caseIsRef) {
      // Keep the id map current as new cases get used, without a full type re-check.
      refreshCaseIds().then(render);
    }
  });
} else {
  /* ===================== Demo data (preview outside Grist) =====================
     Lets you try every feature \u2014 filters, editing, the Case picker, drag-and-
     drop rescheduling, delete \u2014 before connecting a real Grist document. Runs
     through the exact same ingest() used for live data, so what you see here is
     what you'll get once this is wired to your table. Edits are in-memory only
     and reset if you reload the page. */
  state.demoMode = true;

  const DEMO_MAPPINGS = {
    DueDate: "DueDate", Title: "Title", Status: "Status", Description: "Description",
    DaysLeft: "DaysLeft", Category: "Category", Case: "Case", AssignedTo: "AssignedTo", Priority: "Priority",
  };
  // Case is a true Reference column in this scenario (the common law-firm setup:
  // a Case/Matter column referencing a master case-list table by name).
  state.caseTypeKnown = true; state.caseIsRef = true; state.caseTargetTable = "Cases";
  const CASE_IDS = {
    "Reyes v. North Shore Logistics": 501,
    "Kowalski v. City of Cicero": 502,
    "Mbeki v. Elmhurst Hosp.": 503,
    "Okonkwo v. Guaranteed Rate": 504,
    "Intake": 505,
  };

  function demoDue(daysFromToday, hh, mm) {
    const d = new Date(); d.setDate(d.getDate() + daysFromToday);
    if (hh !== undefined) { d.setHours(hh, mm || 0, 0, 0); return Math.floor(d.getTime() / 1000); }
    return Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 1000);
  }
  const L = (...names) => ["L"].concat(names); // Grist ChoiceList cell marker

  let demoRows = [
    { id: 1, Title: "Serve Rule 26(a) initial disclosures", Case: "Reyes v. North Shore Logistics",
      Category: "Discovery", AssignedTo: L("Dana Whitfield"), Priority: "High", Status: "Incomplete",
      DueDate: demoDue(-3), DaysLeft: -3,
      Description: "N.D. Ill. FRCP 26(a)(1) initial disclosures were due Monday; opposing counsel hasn't agreed to an extension." },
    { id: 2, Title: "File motion to compel", Case: "Kowalski v. City of Cicero",
      Category: "Motion", AssignedTo: L("Marcus Obi"), Priority: "High", Status: "Incomplete",
      DueDate: demoDue(-1), DaysLeft: -1, Description: "" },
    { id: 3, Title: "Client intake call \u2014 new referral", Case: "Intake",
      Category: "Client", AssignedTo: L("Sam Ortega"), Priority: "Medium", Status: "Incomplete",
      DueDate: demoDue(0, 10, 0), DaysLeft: 0, Description: "Referred by the Cook County Bar lawyer referral service." },
    { id: 4, Title: "Respond to motion to dismiss", Case: "Okonkwo v. Guaranteed Rate",
      Category: "Motion", AssignedTo: L("Priya Raman"), Priority: "High", Status: "Incomplete",
      DueDate: demoDue(0, 17, 0), DaysLeft: 0, Description: "Response to the 2-615 motion is due by end of day." },
    { id: 5, Title: "Deposition \u2014 Dr. Adeyemi", Case: "Mbeki v. Elmhurst Hosp.",
      Category: "Discovery", AssignedTo: L("Priya Raman", "Dana Whitfield"), Priority: "Medium", Status: "Incomplete",
      DueDate: demoDue(2, 9, 30), DaysLeft: 2, Description: "Rush, Oak Park office. Bring the radiology exhibits." },
    { id: 6, Title: "SOL \u2014 file complaint", Case: "Okonkwo v. Guaranteed Rate",
      Category: "SOL / Limitations", AssignedTo: L("Priya Raman"), Priority: "High", Status: "Incomplete",
      DueDate: demoDue(5), DaysLeft: 5, Description: "735 ILCS 5/13-202 two-year statute of limitations. Do not miss." },
    { id: 7, Title: "Settlement conference", Case: "Kowalski v. City of Cicero",
      Category: "Trial Prep", AssignedTo: L("Marcus Obi", "Dana Whitfield"), Priority: "Medium", Status: "Incomplete",
      DueDate: demoDue(5, 13, 0), DaysLeft: 5, Description: "" },
    { id: 8, Title: "Draft written discovery responses", Case: "Reyes v. North Shore Logistics",
      Category: "Discovery", AssignedTo: L("Dana Whitfield"), Priority: "Low", Status: "Ready",
      DueDate: demoDue(5), DaysLeft: 5, Description: "" },
    { id: 9, Title: "Witness disclosure \u2014 Rule 213(f)", Case: "Mbeki v. Elmhurst Hosp.",
      Category: "Discovery", AssignedTo: L("Priya Raman"), Priority: "High", Status: "Incomplete",
      DueDate: demoDue(7), DaysLeft: 7, Description: "Ill. S. Ct. R. 213(f) expert and lay witness disclosures." },
    { id: 10, Title: "Trial \u2014 jury selection", Case: "Kowalski v. City of Cicero",
      Category: "Trial Prep", AssignedTo: L("Marcus Obi"), Priority: "High", Status: "Incomplete",
      DueDate: demoDue(21), DaysLeft: 21, Description: "" },
    { id: 11, Title: "File answer to counterclaim", Case: "Reyes v. North Shore Logistics",
      Category: "Filing", AssignedTo: L("Dana Whitfield"), Priority: "Medium", Status: "Complete",
      DueDate: demoDue(-6), DaysLeft: -6, Description: "" },
    { id: 12, Title: "Send engagement letter", Case: "Intake",
      Category: "Client", AssignedTo: L("Sam Ortega"), Priority: "Low", Status: "Complete",
      DueDate: demoDue(-10), DaysLeft: -10, Description: "" },
    { id: 13, Title: "Records request \u2014 Elmhurst Hospital", Case: "Mbeki v. Elmhurst Hosp.",
      Category: "Discovery", AssignedTo: L("Priya Raman"), Priority: "Medium", Status: "Incomplete",
      DueDate: demoDue(1), DaysLeft: 1, Description: "HIPAA-compliant authorization already signed by the client." },
    { id: 14, Title: "Quarterly trust account reconciliation", Case: null,
      Category: "Admin", AssignedTo: L("Sam Ortega", "Dana Whitfield"), Priority: "Low", Status: "Incomplete",
      DueDate: demoDue(10), DaysLeft: 10, Description: "Ill. Rule 1.15 trust accounting \u2014 no case, firm-wide task." },
    { id: 15, Title: "Prepare exhibit binder", Case: "Kowalski v. City of Cicero",
      Category: "Trial Prep", AssignedTo: L("Marcus Obi"), Priority: "Medium", Status: "Incomplete",
      DueDate: demoDue(19), DaysLeft: 19, Description: "" },
    { id: 16, Title: "Follow up on settlement offer", Case: "Okonkwo v. Guaranteed Rate",
      Category: "Client", AssignedTo: L("Priya Raman"), Priority: "Low", Status: "Incomplete",
      DueDate: demoDue(3), DaysLeft: 3, Description: "" },
    // Undated \u2014 exercises the "needs attention" panel.
    { id: 17, Title: "Schedule IME", Case: "Mbeki v. Elmhurst Hosp.",
      Category: "Discovery", AssignedTo: L("Priya Raman"), Priority: "Medium", Status: "Incomplete",
      DueDate: null, DaysLeft: null, Description: "" },
    { id: 18, Title: "Open new matter \u2014 Torres referral", Case: "Intake",
      Category: "Client", AssignedTo: L("Sam Ortega"), Priority: null, Status: "Incomplete",
      DueDate: null, DaysLeft: null, Description: "" },
  ];
  let demoNextId = 19;

  function demoIngestAndRender() {
    ingest(demoRows, DEMO_MAPPINGS);
    // A live doc would resolve these via refreshCaseIds(); here we already know them.
    Object.keys(state.caseRegistry).forEach(label => {
      if (CASE_IDS[label] !== undefined) state.caseRegistry[label] = CASE_IDS[label];
    });
    render();
  }

  writeField = async (rowId, colId, value) => {
    if (!colId) return;
    const row = demoRows.find(x => x.id === rowId);
    if (row) row[colId] = value;
    demoIngestAndRender();
  };
  createTask = async (fields) => {
    const row = Object.assign({ id: demoNextId++ }, fields);
    demoRows.push(row);
    demoIngestAndRender();
    return true;
  };
  deleteTask = async (rowId, title) => {
    const label = title && String(title).trim() ? "\u201c" + String(title).trim() + "\u201d" : "this deadline";
    if (!confirm("Delete " + label + "? (Demo data \u2014 this only affects your preview.)")) return;
    demoRows = demoRows.filter(x => x.id !== rowId);
    state.expandedRows.delete(rowId);
    demoIngestAndRender();
  };
  selectInGrist = () => { /* no-op \u2014 nothing to jump to outside a real doc */ };
  detectColumnTypes = async () => { /* types are set directly above for demo data */ };
  refreshCaseIds = async () => { /* ids are seeded directly in demoIngestAndRender */ };

  demoIngestAndRender();
}

render();
</script>
