<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Deadline Calendar — Grist Widget</title>
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<style>
  :root {
    --bg: #ffffff;
    --panel: #fbfbfa;
    --ink: #1d2b2a;
    --ink-soft: #5a6968;
    --ink-faint: #8a9695;
    --line: #e6e8e6;
    --line-strong: #d3d7d4;
    --accent: #1a7f6b;
    --accent-soft: #e7f3f0;
    --today: #fff5e8;
    --today-line: #e6b366;
    --selected: #e7f3f0;
    --danger: #b4452f;
    --green: #1f9d57;
    --green-soft: #e8f6ed;
    --green-mid: #c4e7d1;
    --green-ink: #15663a;
    --green-line: #bfe6cd;
    --red: #c23b22;
    --red-soft: #fbecea;
    --case-hl: #6a4fa0;
    --case-hl-soft: #efe9f7;
    --search-hl: #c9971a;
    --search-hl-soft: #fff6df;
    --radius: 8px;
    --shadow: 0 1px 2px rgba(20,40,38,.06), 0 6px 20px rgba(20,40,38,.07);
    --ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    --display: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: var(--ui);
    color: var(--ink);
    background: var(--bg);
    font-size: 13px;
    line-height: 1.4;
    -webkit-font-smoothing: antialiased;
  }
  #app { display: flex; flex-direction: column; height: 100vh; min-height: 0; }

  /* ---- Toolbar ---- */
  .toolbar {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 9px 12px; border-bottom: 1px solid var(--line);
    background: var(--panel);
  }
  .version {
    font-size: 11px; color: var(--ink-faint);
    font-variant-numeric: tabular-nums; letter-spacing: .02em;
    padding: 2px 7px; border: 1px solid var(--line); border-radius: 20px;
    background: #fff; white-space: nowrap; align-self: center;
  }
  .demo-badge {
    font-size: 11px; font-weight: 700; letter-spacing: .04em; color: #8a5a12;
    padding: 2px 8px; border: 1px solid #e6d0a0; border-radius: 20px;
    background: #fdf3e0; white-space: nowrap; align-self: center;
  }
  .searchwrap { display: flex; align-items: center; gap: 4px; flex: 1 1 220px; max-width: 360px; min-width: 160px; }
  .searchinput {
    flex: 1; min-width: 0; font: inherit; font-size: 12.5px; padding: 6px 9px;
    border: 1px solid var(--line-strong); border-radius: 7px; background: #fff; color: var(--ink);
  }
  .searchinput:focus { outline: none; border-color: var(--search-hl); box-shadow: 0 0 0 3px var(--search-hl-soft); }
  .search-count { font-size: 11px; color: var(--search-hl); font-weight: 700; white-space: nowrap; }
  .searchnav { flex: none; border: 1px solid var(--line-strong); background: #fff; color: var(--ink-soft); cursor: pointer; font-size: 12px; width: 22px; height: 22px; border-radius: 5px; line-height: 1; padding: 0; }
  .searchnav:hover { background: var(--search-hl-soft); border-color: var(--search-hl); color: var(--search-hl); }
  .searchclear { flex: none; border: 0; background: transparent; color: var(--ink-faint); cursor: pointer; font-size: 12px; padding: 3px 5px; border-radius: 5px; }
  .searchclear:hover { background: #eef1ef; color: var(--ink); }
  .agenda-search-hd {
    font-size: 11.5px; font-weight: 700; padding: 10px 4px 4px; color: var(--search-hl);
    text-transform: none; letter-spacing: 0;
  }
  .agenda-search-hd.agenda-search-hd-rest { color: var(--ink-faint); text-transform: uppercase; letter-spacing: .06em; font-size: 11px; padding-top: 16px; }
  .seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: var(--radius); overflow: hidden; }
  .seg button {
    border: 0; background: transparent; padding: 6px 12px; font: inherit; cursor: pointer;
    color: var(--ink-soft); border-right: 1px solid var(--line-strong);
  }
  .seg button:last-child { border-right: 0; }
  .seg button.active { background: var(--accent); color: #fff; }
  .seg button:not(.active):hover { background: #eef1ef; }

  .nav { display: inline-flex; align-items: center; gap: 4px; }
  .iconbtn {
    border: 1px solid var(--line-strong); background: #fff; border-radius: var(--radius);
    width: 30px; height: 30px; cursor: pointer; color: var(--ink-soft); font-size: 15px; line-height: 1;
  }
  .iconbtn:hover { background: #eef1ef; }
  .todaybtn {
    border: 1px solid var(--line-strong); background: #fff; border-radius: var(--radius);
    padding: 6px 12px; cursor: pointer; font: inherit; color: var(--ink-soft);
  }
  .todaybtn:hover { background: #eef1ef; }

  .period {
    font-family: var(--display); font-size: 18px; font-weight: 600; letter-spacing: .2px;
    margin: 0 4px; white-space: nowrap;
  }
  .spacer { flex: 1 1 auto; }

  .dropwrap { position: relative; }
  .dropbtn {
    border: 1px solid var(--line-strong); background: #fff; border-radius: var(--radius);
    padding: 6px 11px; cursor: pointer; font: inherit; color: var(--ink-soft);
    display: inline-flex; align-items: center; gap: 6px;
  }
  .dropbtn:hover { background: #eef1ef; }
  .dropbtn[disabled] { opacity: .4; cursor: not-allowed; }
  .dropbtn .dot { background: var(--accent); color: #fff; border-radius: 20px; font-size: 11px; padding: 0 6px; }
  .caret { color: var(--ink-faint); font-size: 10px; }

  .popover {
    position: absolute; top: calc(100% + 6px); right: 0; z-index: 50;
    background: #fff; border: 1px solid var(--line-strong); border-radius: 10px;
    box-shadow: var(--shadow); min-width: 220px; max-width: 300px; padding: 8px;
  }
  .pophead { display: flex; align-items: flex-start; justify-content: space-between; }
  .popclose { border: 0; background: transparent; cursor: pointer; font-size: 18px; line-height: 1; color: var(--ink-faint); padding: 2px 6px 6px; }
  .popclose:hover { color: var(--ink); }
  .popover h4 { margin: 4px 6px 8px; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-faint); }
  .poprow { display: flex; align-items: center; gap: 8px; padding: 6px; border-radius: 6px; cursor: pointer; }
  .poprow:hover { background: #f3f5f3; }
  .poprow input { margin: 0; }
  .poprow .label { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .poprow .swatch { width: 10px; height: 10px; border-radius: 3px; flex: none; }
  .poplist { max-height: min(640px, 72vh); overflow: auto; }
  .settings-pop { min-width: 260px; max-width: 320px; }
  .settings-row { align-items: flex-start; }
  .settings-row input { margin-top: 2px; flex: none; }
  .settings-text { flex: 1; min-width: 0; }
  .settings-label { font-size: 13px; color: var(--ink); }
  .settings-hint { font-size: 11px; color: var(--ink-faint); margin-top: 2px; line-height: 1.35; }
  .settings-selectrow { padding-top: 8px; padding-bottom: 8px; }
  .settings-select {
    margin-top: 6px; width: 100%; font: inherit; font-size: 12.5px; padding: 5px 8px;
    border: 1px solid var(--line-strong); border-radius: 6px; background: #fff; color: var(--ink);
  }
  .settings-row + .settings-row { border-top: 1px solid var(--line); }
  .popactions { display: flex; gap: 6px; padding: 6px; border-top: 1px solid var(--line); margin-top: 4px; }
  .popactions button { flex: 1; border: 1px solid var(--line-strong); background: #fff; border-radius: 6px; padding: 5px; cursor: pointer; font: inherit; color: var(--ink-soft); }
  .popactions button:hover { background: #eef1ef; }
  .radio-row { display: flex; align-items: center; gap: 8px; padding: 6px; border-radius: 6px; cursor: pointer; }
  .radio-row:hover { background: #f3f5f3; }

  /* ---- Body ---- */
  .body { flex: 1 1 auto; min-height: 0; overflow: auto; scrollbar-gutter: stable; }
  .meta { padding: 6px 12px; color: var(--ink-faint); font-size: 12px; border-bottom: 1px solid var(--line); }
  .meta b { color: var(--ink-soft); font-weight: 600; }

  /* Month grid */
  .month { display: flex; flex-direction: column; min-height: 100%; }
  /* The day panel is a FIXED height, not a max-height — so the month grid above it
     (and every cell in it) never resizes when you select a day with more or fewer
     deadlines. A short list just leaves blank space; a long one scrolls internally. */
  .daypanel { border-top: 2px solid var(--line-strong); background: var(--panel);
              display: flex; flex-direction: column; height: 42vh; flex: none; }
  .daypanel h3 { font-family: var(--display); font-size: 16px; margin: 0; padding: 12px 14px 6px; flex: none; }
  .daypanel .addday { flex: none; }
  .daypanel .list { flex: 1; min-height: 0; overflow: auto; scrollbar-gutter: stable; }
  .daypanel.dragover { box-shadow: inset 0 0 0 2px var(--accent); }
  .weekhead { display: grid; grid-template-columns: repeat(7, 1fr); border-bottom: 1px solid var(--line); }
  .weekhead div { padding: 7px 8px; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-faint); text-align: left; }
  .grid { display: grid; grid-template-columns: repeat(7, 1fr); grid-auto-rows: 1fr; flex: 1; }
  .cell {
    border-right: 1px solid var(--line); border-bottom: 1px solid var(--line);
    padding: 5px 6px; min-height: 96px; cursor: pointer; display: flex; flex-direction: column; gap: 3px; overflow: hidden;
  }
  .cell:nth-child(7n) { border-right: 0; }
  .cell.outside { background: #e9ebe8; }
  .cell.outside .daynum { color: var(--ink-faint); }
  .cell.today { background: var(--today); box-shadow: inset 0 0 0 1px var(--today-line); }
  .cell.selected { background: var(--selected); box-shadow: inset 0 0 0 2px var(--accent); }
  .cell:hover { background: #f1f5f3; }
  .cell.dragover { background: var(--accent-soft); box-shadow: inset 0 0 0 2px var(--accent); }
  .daynum { font-size: 12px; color: var(--ink-soft); font-weight: 600; }
  .chip {
    font-size: 11px; padding: 1px 6px; border-radius: 5px; background: var(--accent-soft);
    color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    border-left: 3px solid var(--accent); cursor: grab;
  }
  .chip:active { cursor: grabbing; }
  .chip.dragging { opacity: .35; }
  .chip .t { color: var(--ink-soft); font-variant-numeric: tabular-nums; margin-right: 4px; }
  .chip.chip-complete { background: var(--green-mid); color: var(--green-ink); }
  .chip.chip-ready { background: var(--green-mid); color: var(--green-ink); }
  .chip.chip-critical { background: var(--red-soft); color: var(--ink); font-weight: 600; }
  .chip.case-highlight { outline: 2px solid var(--case-hl); outline-offset: 1px; }
  .chip.search-match { background: var(--search-hl-soft); outline: 2px solid var(--search-hl); outline-offset: 1px; font-weight: 600; }
  .more { font-size: 11px; color: var(--ink-faint); padding-left: 2px; }
  .more.more-has-match { color: var(--search-hl); font-weight: 700; }

  /* Week */
  .week { display: grid; grid-template-columns: repeat(7, minmax(150px, 1fr)); min-height: 100%; }
  .weekcol { border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  .weekcol.dragover { background: var(--accent-soft); box-shadow: inset 0 0 0 2px var(--accent); }
  .weekcol:last-child { border-right: 0; }
  .weekcol .colhead {
    padding: 8px 10px; border-bottom: 1px solid var(--line); cursor: pointer; position: sticky; top: 0; background: var(--panel); z-index: 1;
  }
  .weekcol .colhead:hover { background: #eef1ef; }
  .weekcol.today .colhead { background: var(--today); box-shadow: inset 0 0 0 1px var(--today-line); }
  .weekcol.selected .colhead { background: var(--selected); box-shadow: inset 0 0 0 2px var(--accent); }
  .colhead .dow { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-faint); }
  .colhead .dnum { font-family: var(--display); font-size: 17px; }
  .colbody { padding: 6px; display: flex; flex-direction: column; gap: 6px; }

  /* Day list rows (shared by day view + month day-panel + week columns) */
  .list { padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
  .row {
    display: flex; gap: 10px; align-items: flex-start; padding: 9px 10px;
    border: 1px solid var(--line); border-radius: 8px; background: #fff; cursor: pointer;
    border-left-width: 4px;
  }
  .row:hover { border-color: var(--line-strong); box-shadow: var(--shadow); }
  .row.dragging { opacity: .35; }
  .row.case-highlight { outline: 2px solid var(--case-hl); outline-offset: 2px; background: var(--case-hl-soft); }
  .row.search-match { outline: 2px solid var(--search-hl); outline-offset: 2px; background: var(--search-hl-soft); }
  .row.search-match.case-highlight { outline: 2px solid var(--search-hl); box-shadow: 0 0 0 4px var(--case-hl-soft); }
  .row .duewrap { position: relative; flex: none; }
  .row .time {
    font-variant-numeric: tabular-nums; color: var(--ink-soft); font-size: 12px; min-width: 64px; padding: 1px 3px 0 0;
    border: 0; background: transparent; font-family: inherit; text-align: left; cursor: pointer; border-radius: 5px;
    text-decoration: underline dotted; text-decoration-color: var(--line-strong); text-underline-offset: 2px;
  }
  .row .time.none { color: var(--ink-faint); }
  .row .time.editable:hover { color: var(--accent); text-decoration-color: var(--accent); }
  .row .time.bare { text-decoration: none; min-width: 0; opacity: .65; }
  .row .time.bare:hover { opacity: 1; }
  .row .time .pen { font-size: 10px; margin-left: 3px; opacity: .45; }
  .row .time.editable:hover .pen { opacity: .9; }
  .row .daysleft { font-size: 11px; margin-top: 2px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .row .daysleft.dl-future { color: var(--ink-faint); }
  .row .daysleft.dl-today { color: #8a5a12; font-weight: 600; }
  .row .daysleft.dl-over { color: var(--red); font-weight: 600; }

  .dateeditor {
    position: absolute; top: calc(100% + 4px); left: 0; z-index: 60; background: #fff;
    border: 1px solid var(--line-strong); border-radius: 8px; box-shadow: var(--shadow);
    padding: 8px; display: flex; flex-direction: column; gap: 6px; min-width: 190px;
  }
  .dateeditor input { font: inherit; padding: 5px 6px; border: 1px solid var(--line-strong); border-radius: 6px; }
  .de-shortcuts { display: flex; flex-wrap: wrap; gap: 5px; }
  .de-shortcuts button {
    border: 1px solid var(--line-strong); background: #f6f8f6; border-radius: 20px;
    padding: 3px 10px; font: inherit; font-size: 11px; cursor: pointer; color: var(--ink-soft);
  }
  .de-shortcuts button:hover { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  .de-actions { display: flex; gap: 6px; }
  .de-actions button { flex: 1; border: 1px solid var(--line-strong); border-radius: 6px; padding: 5px; cursor: pointer; font: inherit; }
  .de-save { background: var(--accent); color: #fff; border-color: var(--accent) !important; }
  .de-save:hover { filter: brightness(1.05); }
  .de-cancel { background: #fff; color: var(--ink-soft); }
  .de-cancel:hover { background: #eef1ef; }

  .row .main { flex: 1; min-width: 0; }
  .row .title { font-weight: 600; font-size: 13px; word-break: break-word; }
  .row .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 5px; }
  .row .desc {
    font-size: 12px; color: var(--ink-soft); margin-top: 5px; white-space: pre-wrap; overflow-wrap: anywhere;
    display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden;
  }
  .row .desc.full { display: block; -webkit-line-clamp: none; overflow: visible; }
  .row .descmore { display: none; font-size: 11px; color: var(--accent); margin-top: 3px; user-select: none; }
  .row.expanded .descmore, .row.truncated .descmore { display: inline-block; }
  .tag { font-size: 11px; padding: 1px 7px; border-radius: 20px; background: #f0f2f0; color: var(--ink-soft); }
  .tag.cat { color: #fff; }
  .tag.asg::before { content: "@"; opacity: .6; margin-right: 1px; }
  .tag.pri { border: 1px solid var(--line-strong); background: #fff; }
  .tag.pri.imp { background: var(--red-soft); border-color: #e6b3a8; color: var(--red); font-weight: 600; }
  .compactrow { flex-direction: column; align-items: stretch; gap: 4px; padding: 7px 9px; border-radius: 7px; }
  .compactrow .duewrap { align-self: flex-start; }
  .compactrow .statuswrap { margin-left: 0; align-self: flex-start; }
  .compactrow .title { font-size: 12px; }

  .row.complete { background: var(--green-mid); }
  .row.ready { background: var(--green-mid); }
  .row.complete .title.done { color: var(--green-ink); }
  .row.critical { background: var(--red-soft); }

  /* Status control */
  .statuswrap { position: relative; flex: none; margin-left: auto; }
  .statuspill {
    border: 1px solid var(--line-strong); background: #fff; border-radius: 20px;
    padding: 3px 11px; font: inherit; font-size: 11px; cursor: pointer; color: var(--ink-soft); white-space: nowrap;
  }
  .statuspill:hover { background: #eef1ef; }
  .statuspill.is-complete { background: var(--green-soft); border-color: var(--green-line); color: var(--green-ink); }
  .statuspill .pcaret { color: var(--ink-faint); font-size: 9px; margin-left: 4px; }
  .statusmenu {
    position: absolute; top: calc(100% + 4px); right: 0; z-index: 60; background: #fff;
    border: 1px solid var(--line-strong); border-radius: 8px; box-shadow: var(--shadow); min-width: 150px; padding: 4px;
  }
  .statusitem {
    display: block; width: 100%; text-align: left; border: 0; background: transparent;
    padding: 6px 10px; border-radius: 6px; font: inherit; cursor: pointer; color: var(--ink);
  }
  .statusitem:hover { background: #f3f5f3; }
  .statusitem.current { font-weight: 600; color: var(--accent); }
  .statusitem.clear { color: var(--ink-faint); border-top: 1px solid var(--line); margin-top: 4px; }

  .lg { margin-left: 12px; color: var(--ink-faint); white-space: nowrap; }
  .lg i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 4px; vertical-align: middle; }

  .empty { color: var(--ink-faint); padding: 14px; font-style: italic; }

  /* Inline field editors (description, assignee) */
  .fieldedit { margin-top: 6px; display: flex; flex-direction: column; gap: 6px; background: #fff; border: 1px solid var(--line-strong); border-radius: 8px; padding: 8px; }
  .fieldedit textarea { font: inherit; min-height: 64px; resize: vertical; border: 1px solid var(--line-strong); border-radius: 6px; padding: 6px; width: 100%; box-sizing: border-box; }
  .fe-actions { display: flex; gap: 6px; }
  .fe-actions button { border: 1px solid var(--line-strong); border-radius: 6px; padding: 5px 12px; cursor: pointer; font: inherit; }
  .fe-save { background: var(--accent); color: #fff; border-color: var(--accent) !important; }
  .fe-save:hover { filter: brightness(1.05); }
  .fe-cancel { background: #fff; color: var(--ink-soft); }
  .fe-cancel:hover { background: #eef1ef; }
  .editlink { font-size: 11px; color: var(--accent); cursor: pointer; user-select: none; margin-top: 4px; display: inline-block; }
  .editlink:hover { text-decoration: underline; }
  .addnote { font-size: 11px; color: var(--ink-faint); cursor: pointer; margin-top: 5px; display: inline-block; user-select: none; }
  .addnote:hover { color: var(--accent); }
  .tag.editchip { background: #fff; border: 1px dashed var(--line-strong); color: var(--ink-faint); cursor: pointer; }
  .tag.editchip:hover { color: var(--accent); border-color: var(--accent); }

  /* Assignee picker (shared by inline editor + new-task modal) */
  .picker { display: flex; flex-wrap: wrap; gap: 6px; }
  .pchip { font-size: 11px; padding: 3px 10px; border-radius: 20px; border: 1px solid var(--line-strong); background: #fff; color: var(--ink-soft); cursor: pointer; }
  .pchip.sel { background: var(--accent); color: #fff; border-color: var(--accent); }
  .padd { display: flex; gap: 6px; margin-top: 6px; }
  .padd input { flex: 1; font: inherit; padding: 5px 6px; border: 1px solid var(--line-strong); border-radius: 6px; min-width: 0; }
  .padd button { border: 1px solid var(--line-strong); background: #f6f8f6; border-radius: 6px; padding: 5px 10px; cursor: pointer; font: inherit; }
  .padd button:hover { background: var(--accent-soft); }

  /* New-deadline button + modal */
  .newbtn { border: 1px solid var(--accent); background: var(--accent); color: #fff; border-radius: var(--radius); padding: 6px 13px; cursor: pointer; font: inherit; font-weight: 600; }
  .newbtn:hover { filter: brightness(1.06); }
  .addday { border: 1px solid var(--line-strong); background: #fff; color: var(--accent); border-radius: 6px; padding: 3px 10px; cursor: pointer; font: inherit; font-size: 12px; margin: 8px 14px 2px; }
  .addday:hover { background: var(--accent-soft); }
  .modal-overlay { position: fixed; inset: 0; background: rgba(20,30,28,.4); display: flex; align-items: flex-start; justify-content: center; z-index: 200; padding: 22px 12px; overflow: auto; }
  .modal { background: #fff; border-radius: 12px; box-shadow: var(--shadow); width: 100%; max-width: 380px; padding: 16px 18px 18px; }
  .modal h3 { font-family: var(--display); margin: 0 0 6px; font-size: 19px; }
  .modal label { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-faint); margin: 11px 0 3px; }
  .modal input[type=text], .modal input[type=date], .modal input[type=time], .modal textarea { width: 100%; font: inherit; padding: 7px 8px; border: 1px solid var(--line-strong); border-radius: 7px; box-sizing: border-box; }
  .modal textarea { min-height: 58px; resize: vertical; }
  .modal .row2 { display: flex; gap: 8px; }
  .modal .row2 > div { flex: 1; }
  .modal-actions { display: flex; gap: 8px; margin-top: 18px; }
  .modal-actions button { flex: 1; border: 1px solid var(--line-strong); border-radius: 8px; padding: 9px; cursor: pointer; font: inherit; }
  .m-create { background: var(--accent); color: #fff; border-color: var(--accent) !important; font-weight: 600; }
  .m-create:hover { filter: brightness(1.05); }
  .m-cancel { background: #fff; color: var(--ink-soft); }
  .m-cancel:hover { background: #eef1ef; }

  /* Needs-attention link + panel */
  .needattn { color: var(--warn, #9a6b12); cursor: pointer; font-weight: 600; }
  .needattn:hover { text-decoration: underline; }
  .ua-sub { color: var(--ink-faint); font-size: 12px; margin: 6px 0 12px; }
  .ua-list { display: flex; flex-direction: column; gap: 8px; max-height: 56vh; overflow: auto; }
  .ua-item { border: 1px solid var(--line); border-left: 4px solid var(--warn-line, #e6b366); border-radius: 8px; padding: 9px 10px; background: #fff; }
  .ua-top { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
  .ua-title { font-weight: 600; word-break: break-word; }
  .ua-reason { font-size: 11px; color: var(--warn, #9a6b12); white-space: nowrap; }
  .ua-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .ua-fix { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 8px; }
  .ua-fix input[type=date] { font: inherit; padding: 5px 7px; border: 1px solid var(--line-strong); border-radius: 6px; }
  .btn-small { border: 1px solid var(--accent); background: var(--accent); color: #fff; border-radius: 6px; padding: 5px 11px; cursor: pointer; font: inherit; font-size: 12px; }
  .btn-small:hover { filter: brightness(1.05); }
  .btn-small.ghost { background: #fff; color: var(--ink-soft); border-color: var(--line-strong); }
  .btn-small.ghost:hover { background: #eef1ef; }
  .btn-small.ghost.danger { color: var(--red); border-color: #e6b3a8; }
  .btn-small.ghost.danger:hover { background: var(--red-soft); border-color: var(--red); }

  .delbtn {
    flex: none; border: 0; background: transparent; color: var(--ink-faint);
    font-size: 13px; padding: 4px 6px; cursor: pointer; border-radius: 6px;
    opacity: .45; line-height: 1; align-self: flex-start;
  }
  .delbtn:hover { background: var(--red-soft); color: var(--red); opacity: 1; }

  /* Messages */
  .notice { padding: 28px; max-width: 460px; margin: 24px auto; text-align: center; color: var(--ink-soft); }

  /* Agenda */
  .agenda { padding: 12px 14px 24px; max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px; }
  .agenda-empty { padding: 40px 12px; text-align: center; color: var(--ink-faint); font-size: 14px; }
  .agenda-band {
    font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em;
    padding: 10px 4px 4px; color: var(--ink-faint);
  }
  .agenda-band:first-child { padding-top: 2px; }
  .agenda-band-3 { color: var(--red); }
  .agenda-band-2 { color: #8a5a12; }
  .agenda-band-1 { color: var(--ink-soft); }
  .agenda-band-0 { color: var(--ink-faint); }
  .notice h2 { font-family: var(--display); color: var(--ink); }
  .notice code { background: #f0f2f0; padding: 1px 5px; border-radius: 4px; }
  .notice ol { text-align: left; line-height: 1.7; }

  @media (max-width: 640px) {
    .period { font-size: 15px; }
    .week { grid-template-columns: repeat(7, minmax(130px, 1fr)); }
  }
</style>
</head>
<body>
<div id="app">
  <div class="toolbar" id="toolbar"></div>
  <div class="meta" id="meta"></div>
  <div class="body" id="body"></div>
</div>

<script>
"use strict";

// Calendar widget version. Bump this on each change and note it here.
// 2.0 — Case/Matter mapping + new-deadline Case picker; hardened create with
//       accurate error messages (access vs. data) and reference-safe writes.
// 2.1 — Case picker is now a type-to-filter field matching the other dropdowns;
//       calendar keeps a consistent size when a busy day's scrollbar appears
//       (stable scrollbar gutter + day panel scrolls internally).
// 2.2 — Case field now matches Status/Category exactly (removed a stray
//       placeholder that made it look different from the other fields).
// 2.3 — Version label moved to the header bar, right next to the + New button.
// 2.4 — Month view's day panel is now a fixed height (was max-height), so the
//       calendar grid no longer resizes when switching between a busy day and
//       an empty one; the day panel's list scrolls internally instead.
// 2.5 — Removed the Title field from "New deadline": Title is a formula column
//       (built from Case + Category), so this widget no longer requires it or
//       writes to it, which would have overridden the formula.
// 2.6 — Fixed "couldn't be linked" on create: Grist was handing back the Case
//       reference already resolved to display text (no row id attached), so a
//       case already in use could fail to link. Now reads the RAW reference
//       values via fetchTable and matches them back by row id, so an existing
//       case links directly instead of falling back to an unlinked deadline.
// 2.7 — Added the ability to fully delete a deadline from the widget: a trash
//       icon on every task row (month/week/day views) and a Delete option in
//       the "needs attention" panel for undated/unplaced tasks. Confirms first,
//       removes the record from the table, and distinguishes an access problem
//       from a data problem if the delete fails.
// 2.8 — Drag and drop to reschedule: drag a chip (month grid) or a task row
//       (day panel / week columns) onto a different day cell, week column, or
//       the day panel to change its due date. Preserves time-of-day for
//       DateTime columns; dropping on the task's current day is a no-op.
//       Native HTML5 drag-and-drop, so touchscreens aren't supported yet.
// 2.9 — Added demo data: opening this page outside Grist now shows a sample
//       docket (16 dated + 2 undated deadlines across 5 fictional matters) so
//       every feature — filters, the Case picker, drag-and-drop, delete,
//       critical flags — can be tried before connecting a real document.
//       A "DEMO DATA" badge appears in the toolbar; edits are in-memory only.
// 3.0 — Added a Settings button (gear icon, toolbar) for options that don't
//       need to be visible all the time. First setting: "Show deadlines from
//       other months" — toggles whether Month view's greyed-out lead/trail
//       days (e.g. late July shown while viewing August) display their
//       deadlines. Defaults on (matches prior behavior); persists per-doc.
// 3.1 — Click a deadline chip or row (or start dragging one) to highlight every
//       other deadline for the same case, in every visible view — so you can
//       see at a glance whether a reschedule would push it past a related
//       deadline. Click again / click empty space to clear. Drag highlighting
//       is applied directly to the page (not via a full re-render), so it
//       can't interrupt an in-progress drag.
// 3.2 — The related-deadline highlight from 3.1 is now a Settings toggle
//       ("Highlight related deadlines"), on by default. Turning it off also
//       clears any highlight currently showing. Only appears in Settings when
//       a Case column is mapped.
// 3.3 — Four new settings: "Start week on" (any day, not just Sunday/Monday —
//       Month grid, Week view, and the week-range label all follow it, even
//       when the weekend ends up in the middle of the row); "Hide weekends"
//       (drops Sat/Sun columns from Month/Week view); "Deadlines shown per
//       day" (2–6, was fixed at 3); "Time format" (12-hour or 24-hour).
// 3.4 — Added an "Agenda" view: a flat, ranked list of every pending (non-
//       complete) deadline, grouped into Overdue / Due Soon / Upcoming / No
//       Date. Ranking is band-first (overdue always outranks upcoming),
//       High priority breaks ties within a band, then soonest/most-overdue
//       first — computed straight from the due date, so it works without
//       any extra column mappings.
// 3.5 — Added a live search box (title/description/case/category/assignee,
//       multi-word AND). Matches are highlighted (a gold outline, distinct
//       from the case-relation highlight) and PROMOTED — sorted ahead of
//       non-matches in every view — rather than hiding non-matches. In
//       Month view this also protects matches from "+N more" truncation; if
//       a day has more matches than visible slots, the overflow line says
//       so. Agenda view splits into a "Matching" section and an "Other
//       pending" section so band headers don't confusingly repeat.
// 3.6 — Added a Settings toggle, "Search hides non-matches" (off by default).
//       Off = 3.5's promote-only behavior. On = search becomes a true filter:
//       non-matching deadlines disappear from Month/Week/Day/Agenda entirely
//       instead of just sorting lower. Has no effect while the search box is
//       empty.
// 3.7 — Enter in the search box jumps the calendar to the next matching
//       deadline's day (Shift+Enter for previous), stepping through matches
//       in chronological order across months — with ‹ › buttons and a
//       "Match N of M" indicator as a mouse alternative. Switching from
//       Agenda view happens automatically since Agenda has no single
//       focused day to jump to. Typing resets the cycle position.
// 3.8 — Added a "Color deadlines by" setting: Category (unchanged default) or
//       Assigned person. Assignee mode colors each deadline by who's on it,
//       using that person's own color from the Deadlines tab when Grist has
//       one configured for them, otherwise a deterministic fallback so every
//       person still gets a distinct, stable color. Deadlines with more than
//       one assignee are split into equal color bands (halves, thirds, etc).
//       Built as an extensible setting — more color modes can be added
//       later without restructuring.
// 3.9 — In Assigned Person mode, assignee color now takes priority over
//       EVERYTHING, including completed (green) and critical (red) status —
//       matching the setting's purpose of identity color being the dominant
//       signal. Category mode is unchanged: status still wins over category
//       there. A completed task's ✓ checkmark text still shows either way;
//       only the competing background/border color is suppressed.
// 4.0 — Fixed inconsistent highlighting in Assigned Person mode: a task with
//       one assignee only had a colored border stripe (default pale
//       background), while 2+ assignees got a fully colored split
//       background. Single-assignee chips/rows are now fully highlighted
//       too, using the same lightened tone as one band of the multi-person
//       gradient, so every assigned deadline reads consistently.
// 4.1 — Fixed "New deadline" not offering a way to set the Case: if none of
//       the currently-loaded deadlines had a Case set yet, the modal showed
//       only a passive note and NO input at all. It now always shows a
//       usable Case field — you can type any case name even with an empty
//       list, and it writes correctly for both Reference and Choice/Text
//       Case columns (creating an unlinked-but-saved deadline, with a note,
//       if it's a brand-new case on a true Reference column).
const WIDGET_VERSION = "4.1";

/* ===================== State ===================== */
const today = new Date();
const state = {
  ready: false,
  haveGrist: typeof grist !== "undefined" && grist && grist.ready,
  demoMode: false,       // true when previewing with sample data outside Grist
  records: [],          // parsed + scheduled deadlines
  mapped: { due: false, title: false, category: false, assignedTo: false, priority: false, status: false, description: false },
  cols: {},             // logical name -> real column id (for write/create)
  statusColId: null,    // real column id of the Status column (for write-back)
  dueColId: null,       // real column id of the Due Date column (for write-back)
  descColId: null,
  asgColId: null,
  dueIsDateTime: false, // whether the due column carries a time component
  dueTypeFromMeta: null,// resolved column type from metadata (null until known)
  asgMulti: false,      // Assigned To holds multiple values (ChoiceList)
  asgTypeKnown: false,
  catMulti: false,      // Category holds multiple values (ChoiceList)
  catTypeKnown: false,
  priIsBool: false,     // Priority is a boolean/toggle column
  priTypeKnown: false,
  caseIsRef: false,      // Case is a true Reference column (vs Choice/Text)
  caseTypeKnown: false,
  caseTargetTable: null, // the reference's target table id, parsed from its type
  caseRegistry: {},      // case label -> row id (or null), from cases already in use
  caseRawById: {},       // deadline row id -> raw Case cell value (unresolved)
  typesChecked: false,
  view: "month",        // 'day' | 'week' | 'month'
  focus: stripTime(today),
  selectedKey: dayKeyFromDate(today),
  sortByPriority: false,
  sortDir: "asc",       // asc = High -> Low
  hiddenCats: new Set(),
  hiddenAsgs: new Set(),
  hiddenStatuses: new Set(),
  redCats: new Set(),   // categories flagged critical (red)
  redCatsInit: false,   // whether redCats has been seeded/loaded
  openPopover: null,    // 'cat' | 'asg' | 'status' | 'sort' | 'flags' | 'settings' | null
  showOutsideDeadlines: true,   // show/hide deadlines in the greyed-out lead/trail days of month view
  highlightCase: null,          // case label whose other deadlines are currently highlighted
  caseHighlightEnabled: true,   // whether clicking/dragging a deadline highlights its case-mates
  weekStartDay: 0,       // 0=Sunday .. 6=Saturday \u2014 which day begins a week
  maxChipsPerDay: 3,     // deadlines shown directly in a month-view cell before "+N more"
  timeFormat: "12h",     // "12h" (AM/PM) or "24h"
  hideWeekends: false,   // omit Saturday/Sunday columns from Month and Week view
  search: "",            // live text search \u2014 highlights and promotes matches, doesn't hide non-matches
  searchFiltersOut: false,   // when true, search HIDES non-matches instead of just demoting them
  searchCycleIndex: null,    // which chronological match Enter-cycling is currently on
  taskColorMode: "category", // "category" (current) | "assignee" \u2014 more modes may be added later
  assigneeColors: {},        // person name -> hex color, read from Grist's own Choice/ChoiceList colors when available
  openStatusRow: null,  // rowId whose status menu is open
  openDateRow: null,    // rowId whose due-date editor is open
  editingDescRow: null, // rowId whose description editor is open
  editingAsgRow: null,  // rowId whose assignee editor is open
  editingCatRow: null,  // rowId whose category editor is open
  editingPriRow: null,  // rowId whose priority editor is open
  expandedRows: new Set(), // rowIds whose full description is shown
  unplaced: [],         // records with no usable due date (not on the calendar)
  showUnplaced: false,  // whether the "needs attention" panel is open
};

const COMPLETE_WORDS = new Set(["complete","completed","done","closed","resolved","finished"]);
const READY_WORDS = new Set(["ready"]);
const NO_STATUS = "(No status)";

const NO_CAT = "(No category)";
const UNASSIGNED = "(Unassigned)";

/* ===================== Date helpers ===================== */
function stripTime(d) { return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
function dayKeyFromYMD(y, m, d) { return y + "-" + m + "-" + d; }       // m is 0-indexed
function dayKeyFromDate(d) { return dayKeyFromYMD(d.getFullYear(), d.getMonth(), d.getDate()); }
function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate() + n); return x; }
function startOfWeek(d) {
  const x = stripTime(d);
  const diff = (x.getDay() - state.weekStartDay + 7) % 7;
  return addDays(x, -diff);
}
// The ordered list of weekday indices (0=Sun..6=Sat) to display as columns,
// rotated to start on state.weekStartDay, with Sat/Sun dropped if hidden.
function visibleDowIndices() {
  const order = [];
  for (let i = 0; i < 7; i++) order.push((state.weekStartDay + i) % 7);
  return state.hideWeekends ? order.filter(d => d !== 0 && d !== 6) : order;
}

const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const DOW = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];

function fmtTime(h, m) {
  if (state.timeFormat === "24h") return pad2(h) + ":" + pad2(m);
  const ap = h >= 12 ? "PM" : "AM";
  let hh = h % 12; if (hh === 0) hh = 12;
  return hh + ":" + String(m).padStart(2, "0") + " " + ap;
}

/* Interpret a Grist date/datetime numeric value.
   - Pure Date columns are stored at UTC midnight (value % 86400 === 0) -> read in UTC, no time.
   - DateTime values -> read in local time, show time if not midnight. */
function parseDue(v) {
  if (v instanceof Date) v = v.getTime() / 1000;
  else if (typeof v === "string" && v.trim() !== "" && !isNaN(Number(v))) v = Number(v);
  if (typeof v !== "number" || !isFinite(v)) return null;
  const hasTime = (v % 86400 !== 0);
  const d = new Date(v * 1000);
  if (hasTime) {
    const h = d.getHours(), m = d.getMinutes();
    return {
      y: d.getFullYear(), mo: d.getMonth(), d: d.getDate(),
      minuteOfDay: h * 60 + m, timed: true,
      timeStr: (h === 0 && m === 0) ? null : fmtTime(h, m),
    };
  }
  return { y: d.getUTCFullYear(), mo: d.getUTCMonth(), d: d.getUTCDate(), minuteOfDay: -1, timed: false, timeStr: null };
}

/* ===================== Value helpers ===================== */
function toList(v) {
  if (v === null || v === undefined || v === "") return [];
  if (Array.isArray(v)) {
    const items = (v[0] === "L") ? v.slice(1) : v;
    return items.filter(x => x !== null && x !== undefined && x !== "").map(x => String(x));
  }
  return [String(v)];
}

const PRI_WORDS = {
  "highest":0,"critical":0,"urgent":0,"emergency":0,"p0":0,"a":0,
  "high":1,"p1":1,"important":1,
  "medium":2,"normal":2,"med":2,"moderate":2,"standard":2,"p2":2,
  "low":3,"p3":3,
  "lowest":4,"p4":4,"none":5
};
function priorityRank(v) {
  if (v === null || v === undefined || v === "") return { num: Infinity, str: "" };
  if (v === true) return { num: 0, str: "" };
  if (v === false) return { num: 6, str: "" };
  if (typeof v === "number") return { num: v, str: "" };
  const s = String(v).trim().toLowerCase();
  if (s === "true" || s === "yes" || s === "y") return { num: 0, str: s };
  if (s === "false" || s === "no" || s === "n") return { num: 6, str: s };
  if (s in PRI_WORDS) return { num: PRI_WORDS[s], str: s };
  const n = parseFloat(s);
  if (!isNaN(n)) return { num: n, str: s };
  return { num: 1000, str: s }; // unknown text -> after known ranks, then alpha
}

// Deterministic pleasant color for a category label.
const CAT_COLORS = ["#1a7f6b","#3a6ea5","#b4452f","#8a5a9c","#a8762a","#2f7d8a","#7a8c2e","#9c4f6b","#4a5d8a","#6b8e23"];
function catColor(label) {
  let h = 0; for (let i = 0; i < label.length; i++) h = (h * 31 + label.charCodeAt(i)) >>> 0;
  return CAT_COLORS[h % CAT_COLORS.length];
}
// Color for a person: prefer the color Grist has configured for that value
// in the Assigned To column itself (read via detectColumnTypes), falling
// back to the same deterministic palette used for categories so everyone
// still gets a distinct, stable color even without one configured in Grist.
function personColor(name) {
  if (state.assigneeColors && state.assigneeColors[name]) return state.assigneeColors[name];
  let h = 0; for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) >>> 0;
  return CAT_COLORS[h % CAT_COLORS.length];
}
function lightenHex(hex, amt) {
  const m = /^#?([0-9a-f]{6})$/i.exec(hex || "");
  if (!m) return hex;
  const n = parseInt(m[1], 16);
  let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  r = Math.round(r + (255 - r) * amt); g = Math.round(g + (255 - g) * amt); b = Math.round(b + (255 - b) * amt);
  return "#" + [r, g, b].map(v => v.toString(16).padStart(2, "0")).join("");
}
// A hard-stop gradient with one equal band per assignee (half-and-half for
// two people, thirds for three, etc.), in pastel tones so chip/row text
// stays legible on top of it.
function assigneeSplitBackground(names) {
  const n = names.length;
  const stops = [];
  names.forEach((name, i) => {
    const c = lightenHex(personColor(name), 0.72);
    stops.push(c + " " + (i / n * 100).toFixed(2) + "%", c + " " + ((i + 1) / n * 100).toFixed(2) + "%");
  });
  return "linear-gradient(90deg, " + stops.join(", ") + ")";
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;" }[c]));
}

/* ===================== Filtering / sorting ===================== */
function recCats(r) { const l = toList(r.category); return l.length ? l : [NO_CAT]; }
function recAsgs(r) { const l = toList(r.assignedTo); return l.length ? l : [UNASSIGNED]; }
function recStatus(r) {
  const s = r.status;
  if (s === null || s === undefined || String(s).trim() === "") return [NO_STATUS];
  return [String(s)];
}

/* ----- Status / criticality classification ----- */
function isComplete(r) {
  if (!state.mapped.status) return false;
  const s = r.status;
  if (s === null || s === undefined) return false;
  return COMPLETE_WORDS.has(String(s).trim().toLowerCase());
}
function isReady(r) {
  if (!state.mapped.status) return false;
  const s = r.status;
  if (s === null || s === undefined) return false;
  return READY_WORDS.has(String(s).trim().toLowerCase());
}
function isImportant(v) {
  if (v === null || v === undefined || v === "") return false;
  return priorityRank(v).num <= 1; // highest/critical/urgent/high/important/p0/p1 or numeric <=1
}
function isCritical(r) {
  if (state.mapped.priority && isImportant(r.priority)) return true;
  if (state.mapped.category && recCats(r).some(c => state.redCats.has(c))) return true;
  return false;
}
// 'complete' and 'ready' (green) win over 'critical' (red), else 'normal'
function classify(r) {
  if (isComplete(r)) return "complete";
  if (isReady(r)) return "ready";
  if (isCritical(r)) return "critical";
  return "normal";
}
// Colors a chip/row. In "assignee" mode, who's assigned always wins \u2014 even
// over completed/ready/critical status \u2014 per the setting's whole point:
// assignee identity is the dominant signal. In "category" mode (default),
// completed/ready/critical status still wins over category, as before.
function applyTaskColor(node, r, kind) {
  if (state.taskColorMode === "assignee" && state.mapped.assignedTo) {
    const names = toList(r.assignedTo);
    if (names.length >= 2) {
      node.style.borderLeftColor = personColor(names[0]);
      node.style.background = assigneeSplitBackground(names);
      return;
    }
    if (names.length === 1) {
      // A single assignee is treated as a 1-band "split" \u2014 same lightening
      // as the multi-person gradient, so every assigned chip/row is fully
      // colored, not just the ones with more than one person on them.
      node.style.borderLeftColor = personColor(names[0]);
      node.style.background = lightenHex(personColor(names[0]), 0.72);
      return;
    }
    node.style.borderLeftColor = "var(--accent)";
    return;
  }
  if (kind === "complete" || kind === "ready") { node.style.borderLeftColor = "var(--green)"; return; }
  if (kind === "critical") { node.style.borderLeftColor = "var(--red)"; return; }
  const cats = recCats(r);
  node.style.borderLeftColor = (state.mapped.category && cats[0] !== NO_CAT) ? catColor(cats[0]) : "var(--accent)";
}
// The CSS class suffix (chip-complete/chip-critical/row status classes) sets
// its own background/text color independent of applyTaskColor's inline
// styles \u2014 in assignee mode that would fight the assignee color, so it's
// suppressed there. The "\u2713 " text prefix for completed items is untouched
// (that's text, not color, so it doesn't compete with assignee coloring).
function visualKind(kind) { return state.taskColorMode === "assignee" ? "normal" : kind; }

function isVisible(r) {
  if (state.mapped.category) {
    const cats = recCats(r);
    if (!cats.some(c => !state.hiddenCats.has(c))) return false;
  }
  if (state.mapped.assignedTo) {
    const asgs = recAsgs(r);
    if (!asgs.some(a => !state.hiddenAsgs.has(a))) return false;
  }
  if (state.mapped.status) {
    const ss = recStatus(r);
    if (!ss.some(s => !state.hiddenStatuses.has(s))) return false;
  }
  if (state.searchFiltersOut && searchActive() && !matchesSearch(r)) return false;
  return true;
}

/* ---- Search: highlights and promotes matches, never hides non-matches.
   Matches title, description, case, category, and assignee; multi-word
   searches are AND'd together. ---- */
function matchesSearch(r) {
  const q = (state.search || "").trim().toLowerCase();
  if (!q) return false;
  const hay = [
    r.title, r.description, r.caseLabel,
    state.mapped.category ? toList(r.category).join(" ") : "",
    state.mapped.assignedTo ? toList(r.assignedTo).join(" ") : "",
  ].filter(v => v !== null && v !== undefined).join(" ").toLowerCase();
  return q.split(/\s+/).filter(Boolean).every(term => hay.indexOf(term) >= 0);
}
function searchActive() { return (state.search || "").trim() !== ""; }

// Pure chronological order (earliest due date/time first) \u2014 distinct from
// the ranking comparators, since stepping through search results should walk
// the calendar in date order, not by urgency.
function chronoCompare(a, b) {
  if (a.due.y !== b.due.y) return a.due.y - b.due.y;
  if (a.due.mo !== b.due.mo) return a.due.mo - b.due.mo;
  if (a.due.d !== b.due.d) return a.due.d - b.due.d;
  return (a.due.minuteOfDay || 0) - (b.due.minuteOfDay || 0);
}
function searchMatchesChrono() {
  return state.records.filter(r => isVisible(r) && matchesSearch(r)).sort(chronoCompare);
}
// Move the calendar's focus to the next (or previous) matching deadline's
// day, wrapping around. Only dated matches can be jumped to \u2014 an undated
// match has no day to focus the calendar on.
function cycleSearchMatch(dir) {
  if (!searchActive()) return;
  const matches = searchMatchesChrono();
  if (!matches.length) return;
  const cur = (typeof state.searchCycleIndex === "number") ? state.searchCycleIndex : -1;
  const next = ((cur + dir) % matches.length + matches.length) % matches.length;
  state.searchCycleIndex = next;
  const r = matches[next];
  state.focus = new Date(r.due.y, r.due.mo, r.due.d);
  state.selectedKey = dayKeyFromYMD(r.due.y, r.due.mo, r.due.d);
  if (state.view === "agenda") state.view = "month";   // agenda has no "focused day" to jump to
  renderKeepFocus();
}

function compareRows(a, b) {
  if (searchActive()) {
    const ma = matchesSearch(a) ? 1 : 0, mb = matchesSearch(b) ? 1 : 0;
    if (ma !== mb) return mb - ma;
  }
  if (state.sortByPriority && state.mapped.priority) {
    const pa = priorityRank(a.priority), pb = priorityRank(b.priority);
    let c = pa.num - pb.num;
    if (c === 0) c = pa.str.localeCompare(pb.str);
    if (state.sortDir === "desc") c = -c;
    if (c !== 0) return c;
  }
  if (a.due.minuteOfDay !== b.due.minuteOfDay) return a.due.minuteOfDay - b.due.minuteOfDay;
  return String(a.title).localeCompare(String(b.title));
}

function distinctValues(getter) {
  const set = new Set();
  for (const r of state.records) for (const v of getter(r)) set.add(v);
  return Array.from(set).sort((a, b) => a.localeCompare(b));
}

function recordsForKey(key) {
  return state.records.filter(r => r.key === key && isVisible(r)).sort(compareRows);
}

function shift(dir) {
  if (state.view === "month") state.focus = new Date(state.focus.getFullYear(), state.focus.getMonth() + dir, 1);
  else if (state.view === "week") state.focus = addDays(state.focus, 7 * dir);
  else { state.focus = addDays(state.focus, dir); state.selectedKey = dayKeyFromDate(state.focus); }
  render();
}

function periodLabel() {
  const f = state.focus;
  if (state.view === "agenda") return "Pending Deadlines";
  if (state.view === "month") return MONTHS[f.getMonth()] + " " + f.getFullYear();
  if (state.view === "day") return DOW[f.getDay()] + ", " + MONTHS[f.getMonth()] + " " + f.getDate() + ", " + f.getFullYear();
  const s = startOfWeek(f);
  let e = addDays(s, 6);
  if (state.hideWeekends) {
    // The weekend's position within the 7-day span shifts with weekStartDay
    // (e.g. a Wednesday-start week has the weekend in the middle, not the end),
    // so find the latest actual weekday rather than assuming a fixed offset.
    for (let k = 6; k >= 0; k--) {
      const cand = addDays(s, k);
      if (cand.getDay() !== 0 && cand.getDay() !== 6) { e = cand; break; }
    }
  }
  if (s.getMonth() === e.getMonth()) return MONTHS[s.getMonth()] + " " + s.getDate() + "\u2013" + e.getDate() + ", " + s.getFullYear();
  return MONTHS[s.getMonth()].slice(0,3) + " " + s.getDate() + " \u2013 " + MONTHS[e.getMonth()].slice(0,3) + " " + e.getDate() + ", " + e.getFullYear();
}

  const btn = el("button", "dropbtn");
  btn.innerHTML = esc(label);
  if (hiddenSet.size > 0) btn.innerHTML += ' <span class="dot">' + activeCount + "/" + values.length + "</span>";
  btn.innerHTML += ' <span class="caret">&#9662;</span>';
  btn.onclick = (e) => { e.stopPropagation(); state.openPopover = state.openPopover === id ? null : id; render(); };
  wrap.appendChild(btn);

  if (state.openPopover === id) {
    const pop = el("div", "popover");
    pop.onclick = (e) => e.stopPropagation();
    pop.appendChild(popHeader("Show " + label.toLowerCase()));
    const list = el("div", "poplist");
    values.forEach(v => {
      const r = el("label", "poprow");
      const cb = document.createElement("input"); cb.type = "checkbox"; cb.checked = !hiddenSet.has(v);

      r.appendChild(cb);

      r.appendChild(Object.assign(el("span", "label"), { textContent: v }));
      list.appendChild(r);

    pop.appendChild(list);
    const acts = el("div", "popactions");

    all.onclick = () => { values.forEach(v => hiddenSet.delete(v)); persist(); render(); };
    const none = el("button"); none.textContent = "Clear";
    none.onclick = () => { values.forEach(v => hiddenSet.add(v)); persist(); render(); };
    acts.append(all, none);

    wrap.appendChild(pop);
  }
  return wrap;
}

      state.maxChipsPerDay,
      (v) => { state.maxChipsPerDay = parseInt(v, 10); persist(); render(); }
    ));

    list.appendChild(settingsSelectRow(
      "Time format",
      "How times are displayed for timed deadlines.",
      [["12h","12-hour (2:30 PM)"],["24h","24-hour (14:30)"]],
      state.timeFormat,
      (v) => { state.timeFormat = v; persist(); render(); }
    ));

    list.appendChild(settingsToggleRow(
      "Show deadlines from other months",
      "In Month view, include deadlines that fall on the greyed-out leading/trailing days from the previous or next month.",
      state.showOutsideDeadlines,
      (checked) => { state.showOutsideDeadlines = checked; persist(); render(); }
    ));

    list.appendChild(settingsToggleRow(
      "Search hides non-matches",
      "When searching, hide deadlines that don't match instead of just moving them lower in the list.",
      state.searchFiltersOut,
      (checked) => { state.searchFiltersOut = checked; persist(); render(); }
    ));

    if (state.mapped.assignedTo) {
      list.appendChild(settingsSelectRow(
        "Color deadlines by",
        "\u201cCategory\u201d is the current behavior. \u201cAssigned person\u201d colors each deadline by who's on it \u2014 using that person's color from the Deadlines tab if you've set one there, split into equal bands for deadlines with more than one person. (Completed and critical deadlines still show green/red either way.)",
        [["category", "Category"], ["assignee", "Assigned person"]],
        state.taskColorMode,
        (v) => { state.taskColorMode = v; persist(); render(); }
      ));
    }

    if (state.mapped.caseRef) {
      list.appendChild(settingsToggleRow(
        "Highlight related deadlines",
        "When you click or start dragging a deadline, highlight every other deadline for the same case \u2014 so you can spot one you'd be moving past.",
        state.caseHighlightEnabled,
        (checked) => {
          state.caseHighlightEnabled = checked;
          if (!checked) state.highlightCase = null;   // turning it off also clears any active highlight
          persist(); render();
        }
      ));
    }

    pop.appendChild(list);
    wrap.appendChild(pop);
  }
  return wrap;
}

/* ---- Deadline row ---- */
function delBtn(r) {
  const b = el("button", "delbtn");
  b.innerHTML = "\u{1F5D1}";
  b.title = "Delete this deadline";
  b.onclick = (e) => { e.stopPropagation(); deleteTask(r.id, r.title); };
  return b;
}

function caseHighlightOn() { return state.caseHighlightEnabled && state.mapped.caseRef; }

function rowEl(r, compact) {
  const kind = classify(r);
  const expanded = state.expandedRows.has(r.id);
  const editingAsg = state.editingAsgRow === r.id;
  const editingDesc = state.editingDescRow === r.id;
  const editingCat = state.editingCatRow === r.id;
  const editingPri = state.editingPriRow === r.id;
  const related = caseHighlightOn() && r.caseLabel && r.caseLabel === state.highlightCase;
  const matched = searchActive() && matchesSearch(r);
  const row = el("div", "row " + visualKind(kind) + (compact ? " compactrow" : "") + (expanded ? " expanded" : "") + (related ? " case-highlight" : "") + (matched ? " search-match" : ""));
  applyTaskColor(row, r, kind);
  if (caseHighlightOn() && r.caseLabel) row.dataset.case = r.caseLabel;
  makeDraggable(row, r);

  row.appendChild(dueCell(r, compact));

  const main = el("div", "main");
  const title = el("div", "title" + (kind === "complete" ? " done" : ""));
  title.textContent = (kind === "complete" ? "\u2713 " : "") + (r.title || "(untitled)");
  main.appendChild(title);

  const tags = el("div", "tags");
  if (state.mapped.category && !editingCat) {
    recCats(r).forEach(c => {
      if (c === NO_CAT) return;
      const t = el("span", "tag cat"); t.style.background = catColor(c); t.textContent = c; tags.appendChild(t);
    });
    const hasCat = recCats(r)[0] !== NO_CAT;
    tags.appendChild(makeEditChip(hasCat, "\uFF0B category", "Edit category", () => openInlineEditor("cat", r.id)));
  }
  if (state.mapped.assignedTo && !editingAsg) {
    recAsgs(r).forEach(a => {
      if (a === UNASSIGNED) return;
      tags.appendChild(Object.assign(el("span", "tag asg"), { textContent: a }));
    });
    const hasAsg = recAsgs(r)[0] !== UNASSIGNED;
    tags.appendChild(makeEditChip(hasAsg, "\uFF0B assign", "Edit who's assigned", () => openInlineEditor("asg", r.id)));
  }
  if (state.mapped.priority && !editingPri) {
    const important = isImportant(r.priority);
    const hasPri = r.priority !== null && r.priority !== undefined && r.priority !== "" && r.priority !== false;
    if (state.priIsBool) {
      if (important) tags.appendChild(Object.assign(el("span", "tag pri imp"), { textContent: "Important!" }));
    } else if (hasPri) {
      tags.appendChild(Object.assign(el("span", "tag pri" + (important ? " imp" : "")), { textContent: "\u25B2 " + r.priority }));
    }
    const showVal = state.priIsBool ? important : hasPri;
    tags.appendChild(makeEditChip(showVal, "\uFF0B priority", "Edit priority", () => openInlineEditor("pri", r.id)));
  }
  if (tags.children.length) main.appendChild(tags);

  if (state.mapped.category && editingCat) main.appendChild(categoryEditor(r));
  if (state.mapped.assignedTo && editingAsg) main.appendChild(assigneeEditor(r));
  if (state.mapped.priority && editingPri) main.appendChild(priorityEditor(r));

  // Description: editor, or expandable preview, or "+ Add note"
  const hasDesc = r.description !== null && r.description !== undefined && String(r.description).trim() !== "";
  if (state.mapped.description) {
    if (editingDesc) {
      main.appendChild(descEditor(r));
    } else if (hasDesc) {
      const desc = el("div", "desc" + (expanded ? " full" : ""));
      desc.textContent = String(r.description);
      main.appendChild(desc);
      main.appendChild(Object.assign(el("div", "descmore"), { textContent: expanded ? "Show less \u25B4" : "Show more \u25BE" }));
      if (expanded) {
        const ed = el("span", "editlink"); ed.textContent = "Edit note";
        ed.onclick = (e) => { e.stopPropagation(); openInlineEditor("desc", r.id); };
        main.appendChild(ed);
      }
    } else {
      const add = el("span", "addnote"); add.textContent = "\uFF0B Add note";
      add.onclick = (e) => { e.stopPropagation(); openInlineEditor("desc", r.id); };
      main.appendChild(add);
    }
  }
  row.appendChild(main);

  if (state.mapped.status) row.appendChild(statusControl(r, kind));
  row.appendChild(delBtn(r));

  row.onclick = (e) => {
    e.stopPropagation();
    if (hasDesc && !editingDesc) {
      if (expanded) state.expandedRows.delete(r.id); else state.expandedRows.add(r.id);
    }
    if (caseHighlightOn() && r.caseLabel) {
      state.highlightCase = (state.highlightCase === r.caseLabel) ? null : r.caseLabel;
    }
    render();
    selectInGrist(r.id);
  };
  return row;
}

function makeEditChip(hasValue, emptyLabel, tip, onClick) {
  const c = el("span", "tag editchip");

}

// Clear every transient popover/inline-editor state.
function clearTransient() {
  state.openDateRow = null; state.openStatusRow = null;
  state.editingDescRow = null; state.editingAsgRow = null;
  state.editingCatRow = null; state.editingPriRow = null;
}

// Open one inline editor at a time, closing the other transient popovers.
function openInlineEditor(which, rowId) {
  clearTransient();
  if (which === "desc") state.editingDescRow = rowId;
  else if (which === "asg") state.editingAsgRow = rowId;
  else if (which === "cat") state.editingCatRow = rowId;
  else if (which === "pri") state.editingPriRow = rowId;
  render();
}
